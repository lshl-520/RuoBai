<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>聊天 · 若白 RuoBai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-50:  #FBEAF0;
      --pink-100: #F4C0D1;
      --pink-200: #ED93B1;
      --pink-400: #D4537E;
      --pink-500: #B73D67;
      --pink-700: #72243E;
      --pink-900: #4B1528;
      --cream:    #fffaf6;
      --bg-page:  #fdf7f6;
      --muted:    #993556;
      --subtle:   #b8607e;
      --line:     rgba(244, 192, 209, .55);
      --glass:    rgba(255, 255, 255, .72);
      --shadow:   0 12px 32px rgba(212, 83, 126, .06);
      --shadow-float: 0 18px 36px rgba(212, 83, 126, .14);
      --serif: 'Noto Serif SC', "PingFang SC", "Microsoft YaHei", serif;
      --sans:  'Sora', "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--sans);
      color: var(--pink-900);
      background:
        radial-gradient(circle at 100% 0%, rgba(212, 83, 126, .08), transparent 32%),
        radial-gradient(circle at 0% 100%, rgba(244, 192, 209, .12), transparent 38%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .4), transparent 60%),
        var(--bg-page);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    .app-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 16px 100px;
      -webkit-overflow-scrolling: touch;
    }

    .greeting {
      padding: 24px 0 20px;
    }
    .greeting h1 {
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .greeting p {
      font-size: 14px;
      color: var(--muted);
    }

    .chat-list { display: flex; flex-direction: column; gap: 12px; }

    .chat-card {
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 3px 12px 3px 3px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      transition: transform .24s ease, box-shadow .24s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .chat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-float);
    }

    .chat-card.featured {
      background: linear-gradient(135deg, rgba(251, 234, 240, .92), rgba(244, 192, 209, .5));
      border-color: var(--pink-200);
      overflow: hidden;
    }
    .chat-card.featured::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(212, 83, 126, .06) 0%, transparent 60%);
      animation: heartGlow 3s ease-in-out infinite;
    }
    .chat-card.featured::after {
      content: '';
      position: absolute;
      inset: -120% auto -120% -30%;
      width: 42%;
      transform: rotate(16deg);
      background: linear-gradient(180deg, transparent, rgba(255,255,255,.35), transparent);
      animation: shimmer 5s linear infinite;
      pointer-events: none;
    }

    .avatar {
      width: 55px; height: 55px;
      border-radius: 16px;
      background: linear-gradient(135deg, #fffafb, #fef0f4);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      border: 1px solid rgba(244, 192, 209, .3);
      position: relative;
      z-index: 1;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(212, 83, 126, .06);
    }

    .chat-info {
      flex: 1;
      min-width: 0;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-name { font-family: var(--serif); font-size: 15px; font-weight: 500; }
    .intimacy {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .intimacy-bar {
      flex: 1;
      height: 4px;
      background: var(--pink-50);
      border-radius: 999px;
      overflow: hidden;
    }
    .intimacy-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--pink-200), var(--pink-400));
      border-radius: inherit;
      transition: width .6s ease;
    }
    .intimacy-label {
      font-size: 11px;
      color: var(--pink-400);
      font-weight: 500;
      line-height: 1;
      min-width: 34px;
      text-align: right;
    }

    .tab-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(255, 255, 255, .88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 env(safe-area-inset-bottom, 8px);
      z-index: 100;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--subtle);
      text-decoration: none;
      transition: color .2s;
      padding: 4px 12px;
    }
    .tab-item.active { color: var(--pink-400); }
    .tab-item svg {
      width: 22px; height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tab-item.active svg { stroke-width: 2.2; }

    /* Reveal animation */
    [data-reveal] { opacity: 0; transform: translateY(18px); }
    [data-reveal].is-visible {
      opacity: 1; transform: translateY(0);
      transition: opacity .5s ease, transform .5s ease;
      transition-delay: var(--delay, 0ms);
    }

    @keyframes heartGlow {
      0%, 100% { opacity: .5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    @keyframes shimmer {
      0% { transform: translateX(-180%) rotate(16deg); }
      100% { transform: translateX(420%) rotate(16deg); }
    }
</style>
</head>
<body>
  <div class="app-body">
    <div class="greeting" data-reveal style="--delay:0ms">
      <h1>晚上好呀，江湖小白</h1>
      <p>今天也想认真陪着你～</p>
    </div>

    <div class="chat-list" id="chatList">
      <!-- 角色列表将从后端动态加载 -->
    </div>
  </div>

  <!-- Tab bar -->
  <nav class="tab-bar">
    <a href="chat.html" class="tab-item active">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>聊天</span>
    </a>
    <a href="characters.html" class="tab-item">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>角色</span>
    </a>
    <a href="moments.html" class="tab-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <span>动态</span>
    </a>
    <a href="memory.html" class="tab-item">
      <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
      <span>记忆</span>
    </a>
    <a href="profile.html" class="tab-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>我的</span>
    </a>
  </nav>

  <script>
  // 从后端加载角色列表
  function portraitImage(role) {
    const portraitId = Number(role?.portrait_id ?? role?.portraitId);
    const customUrl = String(role?.portrait_custom_url || role?.portraitCustomUrl || '').trim();
    if (portraitId === 999 && customUrl) return customUrl;
    if (Number.isInteger(portraitId) && portraitId >= 0 && portraitId <= 17) {
      return `/assets/portraits/square/${portraitId}.png`;
    }
    return String(role?.avatar || '').trim();
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function normalizeIntimacy(value) {
    const numeric = Number(value);
    if (!Number.isFinite(numeric)) return 0;
    return Math.max(0, Math.min(99, Math.round(numeric)));
  }

  async function loadCharacters() {
    try {
      const res = await fetch('/api/roles', { credentials: 'include' });
      const data = await res.json();
      if (data?.success && Array.isArray(data.items)) {
        const chatList = document.getElementById('chatList');
        chatList.innerHTML = data.items.map((char, index) => {
          const delay = 60 + index * 70;
          const isFeatured = char.is_active ? ' featured' : '';
          const portraitSrc = portraitImage(char);
          const intimacy = normalizeIntimacy(char.intimacy);
          const avatarHtml = portraitSrc
            ? `<img src="${escapeHtml(portraitSrc)}" alt="${escapeHtml(char.name)}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`
            : escapeHtml(char.name[0] || '角');

          return `
            <a href="chat-room.html?id=${char.id}&name=${encodeURIComponent(char.name)}" class="chat-card${isFeatured}" data-reveal style="--delay:${delay}ms">
              <div class="avatar">${avatarHtml}</div>
              <div class="chat-info">
                <span class="chat-name">${escapeHtml(char.name)}</span>
                <div class="intimacy" aria-label="亲密度 ${intimacy}">
                  <div class="intimacy-bar">
                    <div class="intimacy-fill" style="width:${intimacy}%"></div>
                  </div>
                  <span class="intimacy-label">Lv.${intimacy}</span>
                </div>
              </div>
            </a>
          `;
        }).join('');

        // 重新初始化滚动动画
        initRevealAnimation();
      }
    } catch (e) {
      console.error('加载角色列表失败', e);
    }
  }

  // Reveal on scroll (from 2.0)
  function initRevealAnimation() {
    const revealEls = document.querySelectorAll('[data-reveal]');
    if (revealEls.length) {
      const obs = new IntersectionObserver((entries, o) => {
        entries.forEach(e => {
          if (!e.isIntersecting) return;
          e.target.classList.add('is-visible');
          o.unobserve(e.target);
        });
      }, { threshold: 0.14 });
      revealEls.forEach(el => obs.observe(el));
    }
  }

  // 页面加载时初始化
  loadCharacters();
  </script>
</body>
</html>
