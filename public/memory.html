<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>记忆 · 若白 RuoBai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-50:  #FBEAF0;
      --pink-100: #F4C0D1;
      --pink-200: #ED93B1;
      --pink-400: #D4537E;
      --pink-500: #B73D67;
      --pink-700: #72243E;
      --pink-900: #4B1528;
      --cream:    #fffaf6;
      --bg-page:  #fdf7f6;
      --muted:    #993556;
      --subtle:   #b8607e;
      --line:     rgba(244, 192, 209, .55);
      --glass:    rgba(255, 255, 255, .72);
      --shadow-float: 0 18px 36px rgba(212, 83, 126, .14);
      --serif: 'Noto Serif SC', "PingFang SC", "Microsoft YaHei", serif;
      --sans:  'Sora', "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--sans);
      color: var(--pink-900);
      background:
        radial-gradient(circle at 100% 0%, rgba(212, 83, 126, .08), transparent 32%),
        radial-gradient(circle at 0% 100%, rgba(244, 192, 209, .12), transparent 38%),
        var(--bg-page);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
    }
    .app-body { flex: 1; overflow-y: auto; padding: 0 16px 100px; -webkit-overflow-scrolling: touch; }

    .page-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 0 16px;
    }
    .page-header h1 { font-family: var(--serif); font-size: 24px; font-weight: 500; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .icon-btn {
      width: 32px; height: 32px; border-radius: 10px;
      background: rgba(255, 255, 255, .5); backdrop-filter: blur(8px);
      border: 1px solid rgba(244, 192, 209, .3);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform .24s, box-shadow .24s;
    }
    .icon-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-float); }
    .icon-btn svg { width: 15px; height: 15px; stroke: var(--pink-400); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .publish-btn {
      padding: 5px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(212, 83, 126, .94), rgba(244, 140, 174, .86));
      color: #fff;
      font-size: 11px; font-weight: 500;
      border: none; cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 4px 10px rgba(212, 83, 126, .14);
      text-decoration: none;
    }
    .publish-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(212, 83, 126, .2); }

    /* Avatar row */
    .avatar-row { padding: 12px 0 16px; }
    .avatar-row .avatars { display: flex; justify-content: space-between; }
    .avatar-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; width: calc(100% / 6); flex-shrink: 0; padding: 4px 0;
    }
    .avatar-item .av {
      width: 46px; height: 46px; border-radius: 50%;
      border: 2.5px solid var(--pink-200);
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #fffafb, #fef0f4);
      font-size: 20px; transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .avatar-item .av img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-item:active .av { transform: scale(0.9); }
    .avatar-item.active .av {
      border-color: var(--pink-400);
      box-shadow: 0 0 0 3px rgba(212, 83, 126, .15);
      transform: scale(1.08);
      animation: avatarBreath 2s ease-in-out infinite;
    }
    @keyframes avatarBreath {
      0%, 100% { box-shadow: 0 0 0 3px rgba(212, 83, 126, .15); transform: scale(1.08); }
      50% { box-shadow: 0 0 0 6px rgba(212, 83, 126, .08); transform: scale(1.12); }
    }
    .avatar-item .av-name { font-size: 10px; color: var(--muted); white-space: nowrap; text-align: center; }
    .avatar-item.active .av-name { color: var(--pink-400); font-weight: 500; }
    .more-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; width: calc(100% / 6); flex-shrink: 0; padding: 4px 0;
    }
    .more-btn .av {
      width: 46px; height: 46px; border-radius: 50%;
      border: 2px solid var(--pink-400);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--pink-400); font-weight: 600;
      background: rgba(251, 234, 240, .8); transition: transform .2s, background .2s;
    }
    .more-btn:hover .av { background: var(--pink-50); transform: scale(1.05); }
    .more-btn .av-name { font-size: 10px; color: var(--pink-400); font-weight: 500; }
    .more-btn.active .av {
      background: linear-gradient(135deg, rgba(212, 83, 126, .94), rgba(244, 140, 174, .86));
      color: #fff; border-color: transparent;
      animation: avatarBreath 2s ease-in-out infinite;
    }

    /* Dropdown */
    .more-dropdown {
      position: fixed; min-width: 110px; padding: 8px 0;
      background: rgba(255,255,255,.95); backdrop-filter: blur(20px);
      border: 1px solid var(--line); border-radius: 14px;
      box-shadow: 0 12px 40px rgba(212, 83, 126, .18);
      z-index: 9999; display: none; flex-direction: column;
    }
    .more-dropdown.show { display: flex; }
    .more-dropdown .drop-item {
      padding: 9px 18px; font-size: 13px; color: var(--pink-900);
      cursor: pointer; transition: all .2s; white-space: nowrap;
      margin: 3px 8px; border-radius: 999px; text-align: center;
      background: rgba(251, 234, 240, .5);
    }
    .more-dropdown .drop-item:hover { background: linear-gradient(135deg, rgba(212, 83, 126, .12), rgba(244, 192, 209, .3)); color: var(--pink-400); }
    .more-dropdown .drop-item.active { background: linear-gradient(135deg, rgba(212, 83, 126, .94), rgba(244, 140, 174, .86)); color: #fff; font-weight: 500; }
    .page-note {
      margin: 0 0 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.72);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    /* Memory cards */
    .memory-list { display: flex; flex-direction: column; gap: 12px; }
    .memory-card {
      background: var(--glass); backdrop-filter: blur(16px);
      border: 1px solid var(--line); border-radius: 18px;
      padding: 16px; transition: transform .24s, box-shadow .24s;
    }
    .memory-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-float); }
    .memory-card.pinned {
      background: linear-gradient(90deg, rgba(212, 83, 126, .1), transparent 16px),
        linear-gradient(135deg, rgba(251, 234, 240, .88), rgba(255, 250, 246, .72));
      border-left: 3px solid var(--pink-400);
    }
    .memory-card .pin {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 999px;
      background: rgba(255,255,255,.72); font-size: 12px;
      animation: pinSwing 2.6s ease-in-out infinite; transform-origin: 50% 0;
    }
    .memory-card .ttl { font-family: var(--serif); font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    .memory-card .desc { font-size: 13px; line-height: 1.6; color: var(--muted); margin-bottom: 8px; }
    .memory-card .meta {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: var(--subtle);
    }
    .memory-card .meta-actions { display: flex; gap: 12px; }
    .memory-card .meta-btn {
      color: var(--pink-400); font-weight: 500; cursor: pointer;
      background: none; border: none; font-size: 11px; padding: 2px 0;
      transition: opacity .2s;
    }
    .memory-card .meta-btn:hover { opacity: .7; }
    .memory-card .meta-btn.del { color: var(--subtle); }
    .memory-card .meta-btn.del:hover { color: #c0392b; }
    .memory-card .meta-btn:disabled { opacity: .45; cursor: not-allowed; }
    .empty-state {
      padding: 24px 18px;
      border-radius: 18px;
      border: 1px dashed var(--pink-200);
      background: rgba(255,255,255,.62);
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    .empty-state strong {
      display: block;
      margin-bottom: 6px;
      font-family: var(--serif);
      font-size: 18px;
      color: var(--pink-900);
    }

    /* Chat history entry */
    .history-entry {
      background: linear-gradient(135deg, rgba(251, 234, 240, .6), rgba(255, 250, 246, .5));
      backdrop-filter: blur(16px);
      border: 1px dashed var(--pink-200); border-radius: 18px;
      padding: 16px; display: flex; align-items: center; gap: 12px;
      cursor: pointer; transition: transform .24s, box-shadow .24s;
      margin-top: 8px;
    }
    .history-entry:hover { transform: translateY(-2px); box-shadow: var(--shadow-float); }
    .history-entry .entry-icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--pink-50); display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .history-entry .entry-info { flex: 1; }
    .history-entry .entry-title { font-family: var(--serif); font-size: 14px; font-weight: 500; }
    .history-entry .entry-desc { font-size: 12px; color: var(--subtle); margin-top: 2px; }
    .history-entry .arrow { font-size: 16px; color: var(--subtle); }

    .modal-mask {
      position: fixed; inset: 0;
      display: none; align-items: flex-end; justify-content: center;
      padding: 18px 14px calc(env(safe-area-inset-bottom, 0px) + 18px);
      background: rgba(75, 21, 40, .24);
      backdrop-filter: blur(10px);
      z-index: 10000;
    }
    .modal-mask.show { display: flex; }
    .memory-modal {
      width: min(520px, 100%);
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255,250,246,.96);
      box-shadow: 0 20px 60px rgba(75, 21, 40, .2);
      padding: 18px;
    }
    .modal-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }
    .modal-head h2 { font-family: var(--serif); font-size: 18px; font-weight: 500; }
    .modal-close {
      width: 30px; height: 30px; border: 1px solid var(--line);
      border-radius: 999px; background: rgba(255,255,255,.7);
      color: var(--pink-400); cursor: pointer;
    }
    .memory-form { display: flex; flex-direction: column; gap: 10px; }
    .memory-form label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--subtle); }
    .memory-form input,
    .memory-form textarea {
      width: 100%;
      border: 1px solid rgba(244, 192, 209, .7);
      border-radius: 12px;
      background: rgba(255,255,255,.72);
      color: var(--pink-900);
      font: 14px/1.5 var(--sans);
      outline: none;
      padding: 10px 12px;
    }
    .memory-form textarea { min-height: 108px; resize: vertical; }
    .memory-form input:focus,
    .memory-form textarea:focus { border-color: var(--pink-400); box-shadow: 0 0 0 3px rgba(212, 83, 126, .12); }
    .check-row { flex-direction: row !important; align-items: center; justify-content: space-between; }
    .check-row input { width: 18px; height: 18px; accent-color: var(--pink-400); }
    .modal-error { min-height: 18px; font-size: 12px; color: #b73d67; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
    .modal-actions button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      background: rgba(255,255,255,.72);
      color: var(--pink-400);
    }
    .modal-actions .save {
      border-color: transparent;
      background: linear-gradient(135deg, rgba(212, 83, 126, .94), rgba(244, 140, 174, .86));
      color: #fff;
    }

    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255, 255, 255, .88); backdrop-filter: blur(20px);
      border-top: 1px solid var(--line);
      display: flex; justify-content: space-around; align-items: center;
      padding: 10px 0 env(safe-area-inset-bottom, 8px); z-index: 100;
    }
    .tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--subtle); text-decoration: none; padding: 4px 12px; transition: color .2s; }
    .tab-item.active { color: var(--pink-400); }
    .tab-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tab-item.active svg { stroke-width: 2.2; }

    [data-reveal] { opacity: 0; transform: translateY(18px); }
    [data-reveal].is-visible { opacity: 1; transform: translateY(0); transition: opacity .5s ease, transform .5s ease; transition-delay: var(--delay, 0ms); }

    @keyframes pinSwing { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 65%{transform:rotate(6deg)} }
</style>
</head>
<body>
  <div class="app-body">
    <div class="page-header" data-reveal style="--delay:0ms">
      <div>
        <h1>记忆</h1>
        <p style="font-size:13px;color:var(--subtle);margin-top:2px">她记得关于你的一切</p>
      </div>
      <div class="header-actions">
        <div class="icon-btn" id="searchBtn">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
        <button class="publish-btn" id="addMemoryBtn">新建记忆</button>
      </div>
    </div>

    <div class="avatar-row" data-reveal style="--delay:40ms">
      <div class="avatars">
        <div id="roleAvatarItems" style="display:contents"></div>
        <div class="more-btn active" id="moreBtn">
          <div class="av">更多</div>
          <span class="av-name"></span>
        </div>
      </div>
    </div>

    <div class="history-entry" id="historyEntry" data-reveal style="--delay:80ms">
      <div class="entry-icon">💬</div>
      <div class="entry-info">
        <div class="entry-title">聊天记录</div>
        <div class="entry-desc">翻看和她说过的每一句话</div>
      </div>
      <div class="arrow">›</div>
    </div>

    <div class="memory-list" id="memoryList"></div>
  </div>

  <div class="more-dropdown" id="moreDropdown">
  </div>

  <div class="modal-mask" id="memoryModal" aria-hidden="true">
    <div class="memory-modal" role="dialog" aria-modal="true" aria-labelledby="memoryModalTitle">
      <div class="modal-head">
        <h2 id="memoryModalTitle">新建记忆</h2>
        <button class="modal-close" id="memoryModalClose" type="button" aria-label="关闭">×</button>
      </div>
      <form class="memory-form" id="memoryForm">
        <label>
          记忆内容
          <textarea id="memoryContent" maxlength="2000" placeholder="写下要她记住的事"></textarea>
        </label>
        <label>
          标签
          <input id="memoryTag" maxlength="60" placeholder="普通记忆">
        </label>
        <label>
          分类
          <input id="memoryCategory" maxlength="60" placeholder="喜好、生日、约定">
        </label>
        <label class="check-row">
          <span>置顶这条记忆</span>
          <input id="memoryImportant" type="checkbox">
        </label>
        <div class="modal-error" id="memoryFormError"></div>
        <div class="modal-actions">
          <button type="button" id="memoryCancelBtn">取消</button>
          <button type="submit" class="save" id="memorySaveBtn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <nav class="tab-bar">
    <a href="chat.html" class="tab-item"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>聊天</span></a>
    <a href="characters.html" class="tab-item"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>角色</span></a>
    <a href="moments.html" class="tab-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>动态</span></a>
    <a href="memory.html" class="tab-item active"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z"/><circle cx="12" cy="9" r="2.5"/></svg><span>记忆</span></a>
    <a href="profile.html" class="tab-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>我的</span></a>
  </nav>
  <script type="module">
  import {
    buildChatHistoryHref,
    buildMemoryPayload,
    buildMemoryViewModel,
    escapeHtml
  } from './js/memory-page-utils.mjs';
  import {
    buildCharactersViewModel,
    pickActiveRole
  } from './js/characters-page-utils.mjs';

  const moreBtn = document.getElementById('moreBtn');
  const dropdown = document.getElementById('moreDropdown');
  const roleAvatarItems = document.getElementById('roleAvatarItems');
  const historyEntry = document.getElementById('historyEntry');
  const memoryList = document.getElementById('memoryList');
  const addMemoryBtn = document.getElementById('addMemoryBtn');
  const memoryModal = document.getElementById('memoryModal');
  const memoryModalTitle = document.getElementById('memoryModalTitle');
  const memoryModalClose = document.getElementById('memoryModalClose');
  const memoryForm = document.getElementById('memoryForm');
  const memoryContent = document.getElementById('memoryContent');
  const memoryTag = document.getElementById('memoryTag');
  const memoryCategory = document.getElementById('memoryCategory');
  const memoryImportant = document.getElementById('memoryImportant');
  const memoryFormError = document.getElementById('memoryFormError');
  const memoryCancelBtn = document.getElementById('memoryCancelBtn');
  const memorySaveBtn = document.getElementById('memorySaveBtn');
  let roles = [];
  let currentRole = null;
  let currentMemories = [];
  let editingMemory = null;

  function showNote(text) {
    let note = document.querySelector('.page-note');
    if (!note) {
      note = document.createElement('div');
      note.className = 'page-note';
      document.querySelector('.avatar-row').insertAdjacentElement('afterend', note);
    }
    note.textContent = text;
  }

  function clearNote() {
    document.querySelector('.page-note')?.remove();
  }

  function setMemoryFormBusy(isBusy) {
    memorySaveBtn.disabled = isBusy;
    memoryCancelBtn.disabled = isBusy;
    memoryModalClose.disabled = isBusy;
    memorySaveBtn.textContent = isBusy ? '保存中' : '保存';
  }

  function openMemoryModal(memory = null) {
    if (!currentRole) {
      showNote('请先创建或选择一个角色，再添加记忆');
      return;
    }

    editingMemory = memory;
    memoryModalTitle.textContent = memory ? '编辑记忆' : '新建记忆';
    memoryContent.value = memory?.content || '';
    memoryTag.value = memory?.tag || '';
    memoryCategory.value = memory?.category || '';
    memoryImportant.checked = Boolean(memory?.isImportant);
    memoryFormError.textContent = '';
    setMemoryFormBusy(false);
    memoryModal.classList.add('show');
    memoryModal.setAttribute('aria-hidden', 'false');
    setTimeout(() => memoryContent.focus(), 0);
  }

  function closeMemoryModal() {
    if (memorySaveBtn.disabled) return;
    editingMemory = null;
    memoryModal.classList.remove('show');
    memoryModal.setAttribute('aria-hidden', 'true');
    memoryForm.reset();
    memoryFormError.textContent = '';
  }

  async function requestJson(url, options = {}) {
    const res = await fetch(url, {
      credentials: 'include',
      ...options,
      headers: {
        ...(options.body ? { 'Content-Type': 'application/json' } : {}),
        ...(options.headers || {})
      }
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.success === false) {
      throw new Error(data.error || '操作失败');
    }
    return data;
  }

  moreBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!roles.length) return;
    if (!dropdown.classList.contains('show')) {
      renderDropdown();
      if (dropdown.classList.contains('show')) {
        dropdown.classList.remove('show');
      } else {
        const rect = moreBtn.getBoundingClientRect();
        dropdown.style.top = (rect.bottom + 4) + 'px';
        dropdown.style.right = (window.innerWidth - rect.right) + 'px';
        dropdown.classList.add('show');
      }
      return;
    }
  });

  document.addEventListener('click', () => dropdown.classList.remove('show'));

  function setRole(roleId, el) {
    const role = roles.find(item => String(item.id) === String(roleId));
    if (!role) return;
    document.querySelectorAll('.avatar-item').forEach(a => a.classList.remove('active'));
    document.querySelectorAll('.drop-item').forEach(a => a.classList.remove('active'));
    moreBtn.classList.remove('active');
    if (el) el.classList.add('active');
    currentRole = role;
    dropdown.classList.remove('show');
    loadMemoriesForRole(role);
  }

  function renderRoleAvatars() {
    const firstRoles = roles.slice(0, 5);
    roleAvatarItems.innerHTML = firstRoles.map(role => `
      <div class="avatar-item ${currentRole?.id === role.id ? 'active' : ''}" data-role-id="${role.id}">
        <div class="av">${role.portraitRound ? `<img src="${escapeHtml(role.portraitRound)}" alt="${escapeHtml(role.name)}">` : '🌸'}</div>
        <span class="av-name">${escapeHtml(role.name)}</span>
      </div>
    `).join('');

    roleAvatarItems.querySelectorAll('[data-role-id]').forEach(item => {
      item.addEventListener('click', () => setRole(item.dataset.roleId, item));
    });

    moreBtn.style.display = roles.length > 5 ? '' : 'none';
  }

  function renderDropdown() {
    dropdown.innerHTML = roles.slice(5).map(role => `
      <div class="drop-item ${currentRole?.id === role.id ? 'active' : ''}" data-role-id="${role.id}">${escapeHtml(role.name)}</div>
    `).join('');

    dropdown.querySelectorAll('[data-role-id]').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        setRole(item.dataset.roleId, item);
      });
    });
  }

  function renderMemories() {
    if (!currentRole) {
      memoryList.innerHTML = '<div class="empty-state"><strong>还没有角色</strong><div>先创建角色，再记录记忆。</div></div>';
      return;
    }

    if (!currentMemories.length) {
      memoryList.innerHTML = `<div class="empty-state"><strong>${escapeHtml(currentRole.name)} 还没有记忆</strong><div>后续可以从这里手动补充。</div></div>`;
      return;
    }

    memoryList.innerHTML = currentMemories.map((m, i) => `
      <div class="memory-card is-visible ${m.isImportant ? 'pinned' : ''}" style="--delay:${80 + i * 70}ms">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div class="ttl">${escapeHtml(m.tag)}</div>
          ${m.isImportant ? '<span class="pin">📌</span>' : ''}
        </div>
        <div class="desc">${escapeHtml(m.content)}</div>
        <div class="meta">
          <span>${escapeHtml(m.dateText)}${m.category ? ' · ' + escapeHtml(m.category) : ''}</span>
          <div class="meta-actions">
            <button class="meta-btn pin-btn" data-action="pin" data-id="${m.id}">${m.isImportant ? '取消置顶' : '置顶'}</button>
            <button class="meta-btn" data-action="edit" data-id="${m.id}">编辑</button>
            <button class="meta-btn del" data-action="delete" data-id="${m.id}">删除</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  async function saveMemory(event) {
    event.preventDefault();
    if (!currentRole) return;

    const payload = buildMemoryPayload({
      content: memoryContent.value,
      tag: memoryTag.value,
      category: memoryCategory.value,
      isImportant: memoryImportant.checked
    });

    if (payload.error) {
      memoryFormError.textContent = payload.error;
      return;
    }

    memoryFormError.textContent = '';
    setMemoryFormBusy(true);
    try {
      const url = editingMemory ? `/api/memories/${encodeURIComponent(editingMemory.id)}` : '/api/memories';
      const method = editingMemory ? 'PATCH' : 'POST';
      await requestJson(url, {
        method,
        body: JSON.stringify({ ...payload, character_id: currentRole.id })
      });
      setMemoryFormBusy(false);
      closeMemoryModal();
      await loadMemoriesForRole(currentRole);
    } catch (error) {
      memoryFormError.textContent = error.message || '记忆保存失败';
    } finally {
      setMemoryFormBusy(false);
    }
  }

  async function toggleMemoryPin(memory) {
    if (!currentRole || !memory) return;
    await requestJson(`/api/memories/${encodeURIComponent(memory.id)}`, {
      method: 'PATCH',
      body: JSON.stringify({
        character_id: currentRole.id,
        is_important: !memory.isImportant
      })
    });
    await loadMemoriesForRole(currentRole);
  }

  async function deleteMemory(memory) {
    if (!currentRole || !memory) return;
    if (!window.confirm('确定删除这条记忆吗？')) return;
    await requestJson(`/api/memories/${encodeURIComponent(memory.id)}`, { method: 'DELETE' });
    await loadMemoriesForRole(currentRole);
  }

  memoryList.addEventListener('click', async (event) => {
    const button = event.target.closest('[data-action]');
    if (!button) return;

    const memory = currentMemories.find(item => String(item.id) === String(button.dataset.id));
    if (!memory) return;

    try {
      button.disabled = true;
      if (button.dataset.action === 'edit') {
        openMemoryModal(memory);
      } else if (button.dataset.action === 'pin') {
        await toggleMemoryPin(memory);
      } else if (button.dataset.action === 'delete') {
        await deleteMemory(memory);
      }
    } catch (error) {
      showNote(error.message || '记忆操作失败');
    } finally {
      button.disabled = false;
    }
  });

  addMemoryBtn.addEventListener('click', () => openMemoryModal());
  memoryForm.addEventListener('submit', saveMemory);
  memoryCancelBtn.addEventListener('click', closeMemoryModal);
  memoryModalClose.addEventListener('click', closeMemoryModal);
  memoryModal.addEventListener('click', (event) => {
    if (event.target === memoryModal) closeMemoryModal();
  });

  async function loadMemoriesForRole(role) {
    historyEntry.onclick = () => {
      window.location.href = buildChatHistoryHref(role);
    };
    memoryList.innerHTML = '<div class="empty-state"><strong>正在读取记忆</strong><div>稍等一下。</div></div>';
    try {
      const res = await fetch(`/api/memories?character_id=${encodeURIComponent(role.id)}`, { credentials: 'include' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.success === false) {
        throw new Error(data.error || '记忆列表读取失败');
      }
      currentMemories = buildMemoryViewModel(data.data || data.items || data.memories || []);
      clearNote();
      renderRoleAvatars();
      renderMemories();
    } catch (error) {
      currentMemories = [];
      renderMemories();
      showNote(error.message || '记忆列表读取失败');
    }
  }

  async function loadRoles() {
    memoryList.innerHTML = '<div class="empty-state"><strong>正在读取角色</strong><div>稍等一下。</div></div>';
    try {
      const res = await fetch('/api/roles', { credentials: 'include' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.success === false) {
        throw new Error(data.error || '角色列表读取失败');
      }
      roles = buildCharactersViewModel(data.items || []);
      currentRole = pickActiveRole(roles);
      renderRoleAvatars();
      renderDropdown();
      if (currentRole) {
        await loadMemoriesForRole(currentRole);
      } else {
        renderMemories();
      }
    } catch (error) {
      roles = [];
      currentRole = null;
      roleAvatarItems.innerHTML = '';
      moreBtn.style.display = 'none';
      renderMemories();
      showNote(error.message || '角色列表读取失败');
    }
  }

  const revealEls = document.querySelectorAll('[data-reveal]');
  if (revealEls.length) {
    const obs = new IntersectionObserver((entries, o) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-visible'); o.unobserve(e.target); } });
    }, { threshold: 0.14 });
    revealEls.forEach(el => obs.observe(el));
  }
  loadRoles();
  </script>
</body>
</html>
