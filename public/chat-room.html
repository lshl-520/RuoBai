<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>若白 · RuoBai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-50:  #FBEAF0;
      --pink-100: #F4C0D1;
      --pink-200: #ED93B1;
      --pink-400: #D4537E;
      --pink-500: #B73D67;
      --pink-700: #72243E;
      --pink-900: #4B1528;
      --cream:    #fffaf6;
      --bg-page:  #fdf7f6;
      --muted:    #993556;
      --subtle:   #b8607e;
      --line:     rgba(244, 192, 209, .55);
      --glass:    rgba(255, 255, 255, .72);
      --shadow:   0 12px 32px rgba(212, 83, 126, .06);
      --serif: 'Noto Serif SC', "PingFang SC", "Microsoft YaHei", serif;
      --sans:  'Sora', "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--sans);
      color: var(--pink-900);
      background: var(--bg-page);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    /* ===== 顶部栏 ===== */
    .chat-topbar {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      padding-top: calc(env(safe-area-inset-top, 8px) + 8px);
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
      gap: 10px;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    .icon-btn {
      width: 32px; height: 32px;
      border-radius: 10px;
      background: var(--pink-50);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; text-decoration: none;
      transition: transform .2s, background .2s;
      position: relative;
      overflow: hidden;
    }
    .icon-btn:active { transform: scale(.88); }
    .icon-btn::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle, var(--pink-200) 0%, transparent 70%);
      opacity: 0;
      transition: opacity .3s;
    }
    .icon-btn:active::after { opacity: .3; }
    .icon-btn svg { width: 16px; height: 16px; stroke: var(--pink-400); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; position: relative; z-index: 1; }

    .topbar-info { flex: 1; min-width: 0; }
    .topbar-name { font-family: var(--serif); font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .topbar-name .online-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ecdc4; box-shadow: 0 0 6px rgba(78, 205, 196, .5); animation: pulse 2s infinite; }
    .topbar-status { font-size: 11px; color: var(--subtle); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .topbar-actions { display: flex; gap: 6px; }
    .topbar-actions .icon-btn svg { stroke: var(--subtle); }

    /* 文字按钮 */
    .action-text-btn {
      padding: 6px 12px;
      font-size: 13px;
      color: var(--pink-500);
      background: var(--pink-50);
      border-radius: 8px;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }
    .action-text-btn:hover {
      background: var(--pink-100);
      transform: translateY(-1px);
    }
    .action-text-btn:active {
      transform: translateY(0);
    }
    .action-text-btn.danger {
      color: #e74c3c;
    }

    /* 更多菜单 */
    .more-menu {
      position: absolute;
      top: 100%; right: 12px;
      margin-top: 4px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(212, 83, 126, .15);
      border: 1px solid var(--line);
      padding: 6px 0;
      min-width: 150px;
      z-index: 200;
      opacity: 0;
      transform: translateY(-6px) scale(.95);
      pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .more-menu.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .more-menu-item {
      padding: 10px 18px;
      font-size: 13px;
      color: var(--pink-900);
      cursor: pointer;
      transition: background .15s;
    }
    .more-menu-item:hover { background: var(--pink-50); }
    .more-menu-item.danger { color: #e74c3c; }

    /* ===== 搜索面板 ===== */
    .search-panel {
      position: fixed;
      inset: 0;
      z-index: 240;
      background: rgba(253, 247, 246, .96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .18s ease, transform .18s ease;
      display: flex;
      justify-content: center;
    }
    .search-panel.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .search-shell {
      width: min(100%, 760px);
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 12px calc(env(safe-area-inset-bottom, 8px) + 12px);
    }
    .search-header {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .search-title {
      flex: 1;
      min-width: 0;
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 600;
      color: var(--pink-900);
    }
    .search-close-btn {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 10px;
      background: var(--pink-50);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .search-close-btn svg {
      width: 16px;
      height: 16px;
      stroke: var(--pink-400);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }
    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .search-input-wrap {
      flex: 1;
      min-width: 0;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: rgba(255, 255, 255, .92);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .search-input-wrap svg {
      width: 16px;
      height: 16px;
      stroke: var(--pink-200);
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }
    .search-input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      font: inherit;
      font-size: 14px;
      color: var(--pink-900);
    }
    .search-go-btn {
      height: 44px;
      border: 0;
      border-radius: 12px;
      padding: 0 14px;
      background: var(--pink-400);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .search-summary {
      min-height: 18px;
      padding: 0 4px;
      font-size: 12px;
      color: var(--subtle);
      flex-shrink: 0;
    }
    .search-results {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 4px;
    }
    .search-empty {
      padding: 24px 12px;
      text-align: center;
      color: var(--subtle);
      font-size: 13px;
    }
    .search-item {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, .94);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(212, 83, 126, .04);
    }
    .search-item.active {
      border-color: var(--pink-400);
      box-shadow: 0 10px 22px rgba(212, 83, 126, .12);
    }
    .search-item-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      color: var(--subtle);
    }
    .search-item-text {
      font-size: 13px;
      line-height: 1.6;
      color: var(--pink-900);
      white-space: pre-wrap;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .msg-row.search-hit .msg-bubble {
      box-shadow: 0 0 0 2px rgba(212, 83, 126, .22);
    }

    @keyframes charFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    /* ===== 卡片样式切换 ===== */
    .char-card-wrap {
      flex-shrink: 0; position: relative; z-index: 1;
      max-height: 0; overflow: hidden;
      transition: max-height .35s cubic-bezier(.4, 0, .2, 1), margin .35s;
      margin: 0 0 0;
    }
    .char-card-wrap.open {
      max-height: 200px;
      overflow: visible;
      margin: 0 0 0;
    }
    .char-card-wrap[data-style="card-a"] .char-card-a { display: flex !important; }
    .char-card-wrap[data-style="card-b"] .char-card-b { display: flex !important; }
    .char-card-wrap[data-style="card-c1"] .char-card-c1 { display: flex !important; }
    .char-card-wrap[data-style="card-c2"] .char-card-c2 { display: flex !important; }
    .char-card-wrap[data-style="card-c3"] .char-card-c3 { display: flex !important; }
    .char-card-a, .char-card-b, .char-card-c1, .char-card-c2, .char-card-c3 { display: none !important; }

    /* 方案A：经典卡片（原样式） */
    .char-card-a {
      margin: 8px 12px 0;
      padding: 2px;
      background: linear-gradient(135deg, rgba(253, 247, 246, .85), rgba(251, 234, 240, .45));
      backdrop-filter: blur(16px);
      border: 1px solid var(--pink-200);
      border-radius: 18px;
      gap: 8px;
      align-items: center;
      box-shadow: 0 4px 20px rgba(212, 83, 126, .08);
      position: relative;
      overflow: hidden;
    }
    .char-card-a::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(212, 83, 126, .03) 0%, transparent 60%);
      animation: heartGlow 3s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    .char-card-a::after {
      content: '';
      position: absolute;
      inset: -120% auto -120% -30%;
      width: 42%;
      transform: rotate(16deg);
      background: linear-gradient(180deg, transparent, rgba(212, 83, 126, .12), transparent);
      animation: shimmer 5s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes heartGlow {
      0%, 100% { opacity: .4; transform: scale(1); }
      50% { opacity: .7; transform: scale(1.02); }
    }
    @keyframes shimmer {
      0% { transform: translateX(-180%) rotate(16deg); }
      100% { transform: translateX(420%) rotate(16deg); }
    }
    .char-card-a .a-portrait {
      width: 100px; height: 100px;
      border-radius: 16px;
      overflow: hidden;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--pink-50), #f8e8f0);
      border: 1px solid var(--pink-100);
      position: relative;
      z-index: 2;
    }
    .char-card-a .a-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    /* 伪 3D眨眼动画 */
    .pseudo2d {
      position: relative; width: 100%; height: 100%;
      animation: breatheFloat 4s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes breatheFloat {
      0%, 100% { transform: scale(1) translateY(0); }
      40% { transform: scale(1.01) translateY(-1px); }
      70% { transform: scale(1.005) translateY(-0.5px); }
    }
    .pseudo2d img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: top center;
      opacity: 0;
      transition: opacity .08s ease;
    }
    .pseudo2d img.frame-active { opacity: 1; }
    .pseudo2d img:first-child { opacity: 1; }
    .char-card-a .a-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; position: relative; z-index: 2; }
    .char-card-a .a-name { font-family: var(--serif); font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .char-card-a .a-name .tag {
      font-family: var(--sans); font-size: 10px;
      background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
      color: #fff; padding: 2px 8px; border-radius: 20px; font-weight: 400;
    }
    .char-card-a .a-stats { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--subtle); }
    .char-card-a .a-stats span { display: flex; align-items: center; gap: 3px; }
    .char-card-a .a-quote { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 方案B：浮动立绘 + 亲密度流光条 */
    .char-card-b {
      margin: 6px 12px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding-right: 4px;
    }
    .char-card-b .float-portrait {
      width: 56px; height: 56px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--pink-100);
      box-shadow: 0 4px 16px rgba(212, 83, 126, .15);
      animation: charFloat 3s ease-in-out infinite;
    }
    .char-card-b .float-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .char-card-b .intimacy-bar {
      margin-top: 4px;
      width: 56px;
      height: 4px;
      border-radius: 4px;
      background: var(--pink-50);
      overflow: hidden;
    }
    .char-card-b .intimacy-bar-inner {
      width: 88%;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--pink-200), var(--pink-400), var(--pink-200));
      background-size: 200% 100%;
      animation: barFlow 2s linear infinite;
    }
    @keyframes barFlow {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    /* 方案C1：锁屏风格 */
    .char-card-c1 {
      margin: 0;
      height: 120px;
      background: linear-gradient(135deg, #e8d5f0, #f0d4e8, #d4c5f0);
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      position: relative;
      overflow: hidden;
    }
    .char-card-c1::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at 80% 50%, rgba(255,255,255,.2), transparent 60%);
      pointer-events: none;
    }
    .char-card-c1 .c1-text { position: relative; z-index: 1; }
    .char-card-c1 .c1-name { font-family: var(--serif); font-size: 20px; font-weight: 500; color: #4a2d5e; margin-bottom: 4px; }
    .char-card-c1 .c1-sub { font-size: 12px; color: #7a5090; opacity: .85; }
    .char-card-c1 .c1-portrait {
      width: 90px; height: 100%;
      object-fit: cover;
      object-position: top;
      position: relative; z-index: 1;
      filter: drop-shadow(0 4px 12px rgba(74, 45, 94, .2));
    }

    /* 方案 C2：角色卡风格 */
    .char-card-c2 {
      margin: 8px 12px 0;
      padding: 14px;
      background: linear-gradient(135deg, #2a1a3e, #4a2d5e);
      border-radius: 18px;
      gap: 12px;
      align-items: center;
      box-shadow: 0 6px 24px rgba(42, 26, 62, .3);
      overflow: hidden;
      position: relative;
    }
    .char-card-c2::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.05), transparent 50%);
      pointer-events: none;
    }
    .char-card-c2 .c2-portrait {
      width: 64px; height: 64px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,.15);
    }
    .char-card-c2 .c2-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .char-card-c2 .c2-info { flex: 1; min-width: 0; position: relative; z-index: 1; }
    .char-card-c2 .c2-name { font-family: var(--serif); font-size: 15px; font-weight: 500; color: #fff; display: flex; align-items: center; gap: 6px; }
    .char-card-c2 .c2-name .tag { font-size: 10px; background: rgba(212, 83, 126, .5); color: #fff; padding: 2px 8px; border-radius: 20px; font-family: var(--sans); }
    .char-card-c2 .c2-desc { font-size: 11px; color: rgba(255,255,255,.7); margin-top: 4px; line-height: 1.5; }

    /* 方案 C3：首页横幅风格 */
    .char-card-c3 {
      margin: 8px 12px 0;
      padding: 14px 16px;
      background: linear-gradient(135deg, #fdf0f5, #f5e0f0, #ede0f8);
      border-radius: 18px;
      gap: 12px;
      align-items: center;
      box-shadow: 0 4px 20px rgba(212, 83, 126, .08);
      overflow: hidden;
      position: relative;
    }
    .char-card-c3 .c3-portrait {
      width: 72px; height: 72px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .char-card-c3 .c3-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .char-card-c3 .c3-info { flex: 1; min-width: 0; }
    .char-card-c3 .c3-name { font-family: var(--serif); font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .char-card-c3 .c3-name .tag { font-size: 9px; background: #4ecdc4; color: #fff; padding: 2px 7px; border-radius: 20px; font-family: var(--sans); }
    .char-card-c3 .c3-quote { font-size: 11px; color: var(--muted); font-style: italic; margin: 3px 0; }
    .char-card-c3 .c3-stats { display: flex; gap: 12px; margin-top: 4px; }
    .char-card-c3 .c3-stat-item { text-align: center; }
    .char-card-c3 .c3-stat-num { font-family: var(--serif); font-size: 14px; font-weight: 600; color: var(--pink-400); }
    .char-card-c3 .c3-stat-label { font-size: 9px; color: var(--subtle); }
    .char-card-c3 .c3-anniversary { font-size: 10px; color: var(--subtle); margin-top: 4px; }

    /* ===== 消息区 ===== */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
      background:
        radial-gradient(circle at 80% 20%, rgba(212, 83, 126, .03), transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(244, 192, 209, .05), transparent 40%),
        var(--bg-page);
    }

    .msg-row { display: flex; gap: 8px; max-width: 88%; animation: msgIn .4s cubic-bezier(.34, 1.56, .64, 1) forwards; }
    .msg-row.them { align-self: flex-start; }
    .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 43px; height: 43px; border-radius: 50%;
      background: var(--pink-50); border: 1px solid var(--pink-100);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; overflow: hidden;
    }
    .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .msg-content { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: 100%; }
    .me .msg-content { align-items: flex-end; }
    .msg-bubble-wrap {
      position: relative;
      display: inline-flex;
      align-items: flex-end;
      gap: 6px;
      max-width: 100%;
    }

    .msg-bubble {
      max-width: 100%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.65;
      position: relative;
      transition: transform .15s;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .msg-bubble:active { transform: scale(.97); }
    .them .msg-bubble {
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-top-left-radius: 6px;
    }
    .me .msg-bubble {
      background: linear-gradient(135deg, #e8a0b8, #d4839e);
      color: #fff;
      border-top-right-radius: 6px;
    }
    .msg-time { font-size: 10px; color: var(--subtle); opacity: .7; padding: 0 4px; }
    .msg-stream-error {
      font-size: 12px;
      color: var(--subtle);
      padding: 0 4px;
      opacity: .82;
    }
    .msg-bubble.has-image {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg-image {
      width: min(220px, 100%);
      display: block;
      border-radius: 14px;
      object-fit: cover;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(212, 83, 126, .12);
    }
    .msg-image-text {
      white-space: pre-wrap;
      word-break: break-word;
      padding: 0 4px 2px;
    }
    .tts-play-btn {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .86);
      color: var(--pink-500);
      box-shadow: 0 6px 14px rgba(212, 83, 126, .14);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }
    .tts-play-btn[disabled] {
      opacity: .55;
      cursor: wait;
    }

    /* 状态动画 */
    .msg-typing { display: flex; gap: 5px; padding: 12px 16px; align-items: center; }
    .msg-typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--pink-200);
      animation: typingBounce 1.4s ease-in-out infinite;
    }
    .msg-typing span:nth-child(2) { animation-delay: .2s; }
    .msg-typing span:nth-child(3) { animation-delay: .4s; }

    .status-thinking .msg-typing span { background: var(--pink-100); animation-name: thinkPulse; }
    .status-typing .msg-typing span { background: var(--pink-400); }

    .date-divider {
      text-align: center;
      font-size: 11px;
      color: var(--subtle);
      opacity: .7;
      padding: 8px 0;
    }

    /* ===== 底部输入区 ===== */
    .input-area {
      padding: 8px 10px 10px;
      padding-bottom: max(env(safe-area-inset-bottom, 10px), 10px);
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      position: relative;
      z-index: 160;
    }
    .tool-btn {
      width: 32px; height: 32px; border-radius: 10px;
      background: var(--pink-50);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform .2s, background .15s;
      flex-shrink: 0; position: relative; overflow: hidden;
    }
    .tool-btn:active { transform: scale(.85); }
    .tool-btn::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle, var(--pink-200) 0%, transparent 70%);
      opacity: 0; transition: opacity .3s;
    }
    .tool-btn:active::after { opacity: .35; }
    .tool-btn svg { width: 15px; height: 15px; stroke: var(--pink-400); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; position: relative; z-index: 1; }
    .tool-btn.active { background: var(--pink-100); }

    .input-wrap {
      flex: 1;
      min-width: 0;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 8px 14px;
      display: flex; align-items: center;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-wrap:focus-within {
      border-color: var(--pink-400);
      box-shadow: 0 0 0 3px rgba(212, 83, 126, .08);
    }
    .input-wrap textarea {
      flex: 1; border: none; outline: none;
      background: transparent;
      font-family: inherit; font-size: 14px;
      color: var(--pink-900);
      resize: none; height: 20px; max-height: 80px;
      line-height: 1.4;
      min-width: 0;
    }
    .input-wrap textarea::placeholder { color: var(--subtle); opacity: .6; }

    .send-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--pink-400);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 4px 14px rgba(212, 83, 126, .3);
      animation: sendPulse 3s ease-in-out infinite;
    }
    .send-btn:active { transform: scale(.85); box-shadow: 0 2px 8px rgba(212, 83, 126, .2); }
    .send-btn svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    /* ===== 表情面板 ===== */
    .emoji-panel {
      background: #fff;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s cubic-bezier(.4, 0, .2, 1);
      display: flex;
      flex-direction: column;
    }
    .emoji-panel.show { max-height: 33vh; }
    .emoji-panel-tabs {
      display: flex;
      gap: 4px;
      padding: 10px 12px 0;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .emoji-tab {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      color: var(--subtle);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: .2s;
      font-family: inherit;
      margin-bottom: -1px;
    }
    .emoji-tab.active {
      background: var(--pink-50);
      color: var(--pink-400);
    }
    .emoji-panel-body {
      flex: 1;
      overflow: hidden;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }
    .emoji-panel-slider {
      display: flex;
      width: 200%;
      height: 100%;
      transition: transform .28s cubic-bezier(.4, 0, .2, 1);
    }
    .emoji-section {
      width: 50%;
      height: 100%;
      overflow-y: auto;
      padding: 10px;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .emoji-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .2s, background .15s;
    }
    .emoji-item:hover { background: var(--pink-50); }
    .emoji-item:active { transform: scale(.85); }
    .emoji-item img {
      width: 100%; aspect-ratio: 1;
      border-radius: 10px;
      object-fit: cover;
      background: var(--pink-50);
    }
    .emoji-item-label {
      font-size: 10px;
      color: var(--subtle);
      white-space: nowrap;
    }
    .emoji-unicode-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .emoji-unicode {
      font-size: 24px;
      text-align: center;
      padding: 6px 2px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform .15s, background .15s;
    }
    .emoji-unicode:hover { background: var(--pink-50); }
    .emoji-unicode:active { transform: scale(.8); background: var(--pink-50); }
    .emoji-pack-bar {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 6px 10px;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
      overflow-x: auto;
    }
    .emoji-pack-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: .2s;
      flex-shrink: 0;
      font-size: 14px;
    }
    .emoji-pack-icon:hover { background: var(--pink-50); }
    .emoji-pack-icon.active { background: var(--pink-50); box-shadow: inset 0 -2px 0 var(--pink-400); }

    /* ===== 动画 ===== */
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(16px) scale(.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }
    @keyframes thinkPulse {
      0%, 100% { opacity: .4; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    @keyframes sendPulse {
      0%, 100% { box-shadow: 0 4px 14px rgba(212, 83, 126, .3); }
      50% { box-shadow: 0 4px 20px rgba(212, 83, 126, .5); }
    }
    @keyframes ripple {
      to { transform: scale(2.5); opacity: 0; }
    }
  </style>
</head>

  <script>
    // ===== 角色参数读取 =====
    const params = new URLSearchParams(window.location.search);
    const roleId = parseInt(params.get('id') || '0', 10);

    const DEFAULT_AVATAR = 'images/ruobai-avatar-round.png';
    const DEFAULT_AVATAR_SQ = 'images/xiaobai-portrait-square.png';
    const DEFAULT_USER_AVATAR = 'images/xiaobai-emotions/01_默认温柔.png';
    let currentUserAvatar = DEFAULT_USER_AVATAR;

    let role = {
      id: roleId || null,
      name: '若白',
      tag: '恋人',
      avatar: DEFAULT_AVATAR,
      avatarSq: DEFAULT_AVATAR_SQ,
      portraitSquare: DEFAULT_AVATAR_SQ,
      portraitRound: DEFAULT_AVATAR,
      persona: '',
      intimacy: 0,
      mood: '😊',
      firstChatAt: null,
    };

    function portraitImage(item, variant = 'square') {
      const portraitId = Number(item?.portrait_id ?? item?.portraitId);
      const customUrl = String(item?.portrait_custom_url || item?.portraitCustomUrl || '').trim();
      if (portraitId === 999 && customUrl) return customUrl;
      if (Number.isInteger(portraitId) && portraitId >= 0 && portraitId <= 17) {
        return `/assets/portraits/${variant}/${portraitId}.png`;
      }
      return variant === 'round'
        ? (item?.avatar || DEFAULT_AVATAR)
        : (item?.avatar_sq || item?.avatarSq || item?.avatar || DEFAULT_AVATAR_SQ);
    }

    function normalizeIntimacy(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return 0;
      return Math.max(0, Math.min(100, Math.round(numeric)));
    }

    function moodLabel(value) {
      if (typeof value === 'number') {
        if (value >= 80) return '😊';
        if (value >= 50) return '🙂';
        return '😔';
      }
      const text = String(value || '').trim();
      return text || '😊';
    }

    function companionshipDays(firstChatAt) {
      const ts = Date.parse(firstChatAt);
      if (!Number.isFinite(ts)) return null;
      return Math.max(1, Math.floor((Date.now() - ts) / 86400000));
    }

    function companionshipText(item) {
      const days = companionshipDays(item?.firstChatAt);
      return days ? `陪伴 ${days} 天` : '还没开始陪伴';
    }

    function companionshipShort(item) {
      const days = companionshipDays(item?.firstChatAt);
      return days ? `${days} 天` : '未开始';
    }

    async function loadCurrentUserAvatar() {
      try {
        const res = await fetch('/api/auth/session', { credentials: 'include' });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data?.loggedIn && data.user?.avatar) {
          currentUserAvatar = data.user.avatar;
        }
      } catch (e) {
        console.warn('加载当前用户头像失败', e);
      }
    }

    // 从后端加载角色信息
    async function loadRoleInfo() {
      if (!role.id) return;
      try {
        const res = await fetch('/api/roles', { credentials: 'include' });
        const data = await res.json();
        if (data?.success && Array.isArray(data.items)) {
          const char = data.items.find(c => c.id === role.id);
          if (char) {
            role.name = char.name || role.name;
            role.tag = char.relationship || role.tag;
            role.persona = char.persona || '';
            role.avatar = char.avatar || DEFAULT_AVATAR;
            role.avatarSq = char.avatar_sq || DEFAULT_AVATAR_SQ;
            role.portraitSquare = portraitImage(char, 'square');
            role.portraitRound = portraitImage(char, 'round');
            role.intimacy = normalizeIntimacy(char.intimacy);
            role.mood = moodLabel(char.mood);
            role.firstChatAt = char.first_chat_at || char.firstChatAt || null;
            applyRoleToUI();
          }
        }
      } catch (e) {
        console.warn('加载角色信息失败', e);
      }
    }

    function applyRoleToUI() {
      const intimacy = normalizeIntimacy(role.intimacy);
      const mood = moodLabel(role.mood);
      const companionship = companionshipText(role);
      const companionshipStat = companionshipShort(role);
      document.querySelector('.topbar-status').textContent = `${companionshipStat === '未开始' ? '还没开始陪伴' : `在一起 ${companionshipStat}`} · 亲密 ${intimacy} · 心情 ${mood}`;
      document.title = `${role.name} · RuoBai`;
      document.querySelector('.topbar-name').childNodes[0].textContent = role.name + ' ';
      document.getElementById('inputBox').placeholder = `跟${role.name}说点什么~`;
      document.querySelectorAll('.a-portrait img, .float-portrait img, .c1-portrait, .c2-portrait img, .c3-portrait img').forEach(img => {
        img.src = role.portraitSquare || role.avatarSq || DEFAULT_AVATAR_SQ;
        img.alt = role.name;
      });
      document.querySelector('.a-stats').innerHTML = `
        <span>🌸 ${companionship}</span>
        <span>💕 亲密 ${intimacy}</span>
        <span>${mood} 心情</span>
      `;
      document.querySelector('.c1-name').textContent = role.name;
      document.querySelector('.c1-sub').textContent = companionshipStat === '未开始' ? '还没开始陪伴' : `在一起 ${companionshipStat}`;
      document.querySelector('.c2-desc').textContent = role.persona || `${companionship} · 亲密 ${intimacy}`;
      document.querySelectorAll('.c3-stat-num')[0].textContent = companionshipStat;
      document.querySelectorAll('.c3-stat-num')[1].textContent = `${intimacy}°C`;
      document.querySelector('.c3-anniversary').hidden = true;
      const intimacyBar = document.querySelector('.intimacy-bar-inner');
      if (intimacyBar) intimacyBar.style.width = `${intimacy}%`;
      document.querySelector('.a-name').innerHTML = `${role.name} <span class="tag">${role.tag || '恋人'}</span>`;
      const stickerLabel = document.getElementById('stickerTabLabel');
      if (stickerLabel) stickerLabel.textContent = `${role.name}表情`;
    }
    applyRoleToUI();
    loadRoleInfo(); // 加载角色信息

    async function loadRole() {
      try {
        const res = await fetch('/api/roles', { credentials: 'include' });
        if (!res.ok) return;
        const data = await res.json();
        if (!data?.items) return;
        const found = (roleId && data.items.find(r => r.id === roleId)) || data.items.find(r => r.is_active) || data.items[0];
        if (!found) return;
        role = {
          id: found.id,
          name: found.name || role.name,
          tag: found.tag || '恋人',

        return null;

      const id = Number(savedItem.id);
      if (!Number.isFinite(id) || id <= 0) {

      return {

    let isBrowserTtsResponse = data => Boolean(data?.success && data?.use_browser_tts && data?.text);
    let buildBrowserTtsOptions = (data, voices = []) => {
      const voice = voices.find(item => String(item?.lang || '').toLowerCase().startsWith('zh')) || null;
      return {
        text: String(data?.text || ''),
        lang: voice?.lang || 'zh-CN',

      };

    let isHistoricalErrorBubble = message => {
      if (message?.role !== 'assistant') return false;
      if (message?.message_type === 'image' && message?.media_url) return false;
      const content = String(message?.content || '').trim();
      if (!content) return true;
      const lower = content.toLowerCase();
      return lower.includes('"detail"') ||
        lower.includes('"error"') ||
        lower.includes('not found') ||
        lower.includes('cannot get ') ||
        lower.includes('cannot post ') ||
        lower.includes('failed to fetch') ||
        lower.includes('fetch failed') ||
        lower.includes('is not defined') ||
        lower.includes('referenceerror') ||
        lower.includes('typeerror') ||
        lower.includes('syntaxerror') ||
        lower.includes('/api/') ||
        lower.includes('/v1/v1');
    };

    function formatTime(ts) {
      const d = ts ? new Date(ts) : new Date();
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');

    async function playAssistantMessage(messageId, button) {
      if (!messageId || !button) return;

      if (window.speechSynthesis?.speaking && activeAudioButton === button) {
        window.speechSynthesis.cancel();
        button.disabled = false;
        button.textContent = '▶';
        activeAudioButton = null;
        return;
      }

      if (activeAudio && activeAudioButton === button) {
        activeAudio.pause();
        activeAudio.currentTime = 0;
        activeAudio = null;
        activeAudioButton.disabled = false;
        activeAudioButton.textContent = '▶';
        activeAudioButton = null;
        return;
      }

      if (activeAudio) {
        activeAudio.pause();
        if (activeAudioButton) {
          activeAudioButton.disabled = false;
          activeAudioButton.textContent = '▶';
        }
        activeAudio = null;
        activeAudioButton = null;
      }
      window.speechSynthesis?.cancel?.();

      button.disabled = true;
      button.textContent = '…';

      try {
        const res = await fetch('/api/tts/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ message_id: Number(messageId) })
        });
        const data = await res.json();
        if (!res.ok || !data?.success) {
          throw new Error(data?.error || '语音生成ʧ败');
        }

        if (isBrowserTtsResponse(data)) {
          if (!('speechSynthesis' in window) || !window.SpeechSynthesisUtterance) {
            throw new Error('当前浏览器不支持系统语音');
          }
          const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
          const options = buildBrowserTtsOptions(data, voices);
          const utterance = new SpeechSynthesisUtterance(options.text);
          utterance.lang = options.lang;
          utterance.rate = options.rate;
          utterance.pitch = options.pitch;
          if (options.voice) utterance.voice = options.voice;
          activeAudioButton = button;
          button.disabled = false;
          button.textContent = '▶';
          utterance.addEventListener('end', () => {
            if (activeAudioButton) {
              activeAudioButton.disabled = false;
              activeAudioButton.textContent = '▶';
            }
            activeAudioButton = null;
          }, { once: true });
          utterance.addEventListener('error', () => {
            if (activeAudioButton) {
              activeAudioButton.disabled = false;
              activeAudioButton.textContent = '▶';
            }
            activeAudioButton = null;
          }, { once: true });
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(utterance);
          return;
        }

        if (!data.audio_url) {
          throw new Error(data?.error || '语音生成ʧ败');
        }

        const audio = new Audio(data.audio_url);
        activeAudio = audio;
        activeAudioButton = button;
        button.disabled = false;
        button.textContent = '■';

        audio.addEventListener('ended', () => {
          if (activeAudioButton) {
            activeAudioButton.disabled = false;
            activeAudioButton.textContent = '▶';
          }
          activeAudio = null;
          activeAudioButton = null;
        }, { once: true });

        await audio.play();
      } catch (error) {
        button.disabled = false;
        button.textContent = '▶';
        activeAudio = null;
        activeAudioButton = null;
        alert(`播放ʧ败：${error.message}`);
      }
    }

    async function cleanHistoricalErrorBubbles() {

      try {
        const items = await fetchHistory(Math.max(currentHistoryLimit, 200));
        const targets = items.filter(item => item?.id && isHistoricalErrorBubble(item));

        if (!targets.length) {

    async function sendImageMessage(file) {
      if (!file || sending || !role.id) return;
      sending = true;

      try {
        const mediaUrl = await uploadChatImage(file);
        const text = textarea.value.trim();
        textarea.value = '';
        textarea.style.height = 'auto';

        appendMessage({
          role: 'user',
          content: text,
          created_at: Date.now(),
          message_type: 'image',
          media_url: mediaUrl
        });

        await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            character_id: role.id,
            role: 'user',
            content: text,
            message_type: 'image',
            media_url: mediaUrl
          }),
        });

        const typingRow = appendTypingIndicator();
        let aiRow = null;
        let aiBubble = null;
        let aiText = '';
        let firstChunk = true;

        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
          credentials: 'include',
          body: JSON.stringify({
            character_id: role.id,
            role: 'user',
            content: text,
            message_type: 'image',
            media_url: mediaUrl,
            skip_server_persistence: true
          }),
        });

        if (!res.body) throw new Error('无响应流');
        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf('\n\n')) !== -1) {
            const chunk = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            for (const line of chunk.split('\n')) {
              if (!line.startsWith('data:')) continue;
              const payload = line.slice(5).trim();
              if (!payload || payload === '[DONE]') continue;
              try {
                const obj = JSON.parse(payload);
                if (obj?.type === 'error') {
                  typingRow.remove();
                  if (firstChunk) {
                    aiRow = appendMessage({ role: 'assistant', content: obj.message || '她暂时没反应，稍后再试好吗', created_at: Date.now() });
                    firstChunk = false;
                  }
                  appendStreamErrorNote(aiRow);
                  continue;
                }
                const delta = obj?.choices?.[0]?.delta?.content || '';
                if (delta) {
                  if (firstChunk) {
                    typingRow.remove();
                    aiRow = appendMessage({ role: 'assistant', content: '', created_at: Date.now() });
                    aiBubble = aiRow.querySelector('.msg-bubble');
                    firstChunk = false;
                  }
                  aiText += delta;
                  aiBubble.textContent = aiText;
                  msgArea.scrollTop = msgArea.scrollHeight;
                }
              } catch (_) {}
            }
          }
        }

        if (firstChunk) {
          typingRow.remove();
          appendMessage({ role: 'assistant', content: '（她沉默了一下没有回应）', created_at: Date.now() });
        } else if (aiText && aiRow) {
          await persistAssistantMessage(aiRow, { character_id: role.id, role: 'assistant', content: aiText });
        }
      } finally {
        sending = false;
      }
    }

        });

        if (!res.body) throw new Error('无响应流');
        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf('\n\n')) !== -1) {
            const chunk = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            for (const line of chunk.split('\n')) {
              if (!line.startsWith('data:')) continue;
              const payload = line.slice(5).trim();
              if (!payload || payload === '[DONE]') continue;
              try {
                const obj = JSON.parse(payload);
                if (obj?.type === 'error') {
                  typingRow.remove();
                  if (firstChunk) {
                    aiRow = appendMessage({ role: 'assistant', content: obj.message || '她暂时没反应，稍后再试好吗', created_at: Date.now() });
                    firstChunk = false;
                  }
                  appendStreamErrorNote(aiRow);
                  continue;
                }
                const delta = obj?.choices?.[0]?.delta?.content || '';
                if (delta) {
                  if (firstChunk) {
                    typingRow.remove();
                    aiRow = appendMessage({ role: 'assistant', content: '', created_at: Date.now() });
                    aiBubble = aiRow.querySelector('.msg-bubble');
                    firstChunk = false;
                  }
                  aiText += delta;
                  aiBubble.textContent = aiText;
                  msgArea.scrollTop = msgArea.scrollHeight;
                }
              } catch (_) {}
            }
          }
        }

        if (firstChunk) {
          typingRow.remove();
          appendMessage({ role: 'assistant', content: '（她沉默了一下没有回应）', created_at: Date.now() });
        } else if (aiText && aiRow) {
          try {
            await persistAssistantMessage(aiRow, { character_id: role.id, role: 'assistant', content: aiText });
          } catch (e) { console.warn('AI 回复保存失败', e); }
        }
      } catch (e) {
        typingRow.remove();
        appendMessage({ role: 'assistant', content: `（出错了：${e.message}）`, created_at: Date.now() });
      } finally {
        sending = false;
      }
    }

    // 初ʼ化
    (async () => {
      await loadCurrentUserAvatar();
      await loadRole();
      await loadHistoryWithLimit(50);
    })();

    // ===== 卡片样式 + 开关 =====
    const cardWrap = document.getElementById('charCardWrap');
    const savedStyle = localStorage.getItem('ruobai-card-style') || 'card-a';
    cardWrap.dataset.style = savedStyle;

    const cardOpen = localStorage.getItem('ruobai-card-open') === 'true';
    if (cardOpen) cardWrap.classList.add('open');

    const cardToggleBtn = document.getElementById('cardToggleBtn');
    const moreBtn = document.getElementById('moreBtn');
    const moreMenu = document.getElementById('moreMenu');
    const searchPanel = document.getElementById('searchPanel');
    const searchCloseBtn = document.getElementById('searchCloseBtn');
    const searchInput = document.getElementById('searchInput');
    const searchGoBtn = document.getElementById('searchGoBtn');
    const searchResults = document.getElementById('searchResults');
    const searchSummary = document.getElementById('searchSummary');

    setCardOpen(cardOpen);

    cardToggleBtn?.addEventListener('click', () => {
      setCardOpen(!cardWrap.classList.contains('open'));
    });
    if (cardOpen) cardToggleBtn?.classList.add('active');

    if (moreBtn && moreMenu) {
      moreBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        moreMenu.classList.toggle('show');
      });
      document.addEventListener('click', () => moreMenu.classList.remove('show'));
      moreMenu.addEventListener('click', (e) => {
        const act = e.target?.dataset?.act;
        if (!act) return;
        moreMenu.classList.remove('show');
        if (act === 'detail') {
          setCardOpen(!cardWrap.classList.contains('open'));
        } else if (act === 'search') {
          location.href = `search.html?id=${encodeURIComponent(role.id || roleId || '')}&name=${encodeURIComponent(role.name || '若白')}`;
        } else if (act === 'clean-errors') {
          cleanHistoricalErrorBubbles();
        } else if (act === 'clear') {
          clearCurrentChat();
        }
      });
    }

    searchCloseBtn?.addEventListener('click', closeSearchPanel);
    searchPanel?.addEventListener('click', (e) => {
      if (e.target === searchPanel) closeSearchPanel();
    });
    searchGoBtn?.addEventListener('click', runSearch);
    searchInput?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        runSearch();
      } else if (e.key === 'Escape') {
        closeSearchPanel();
      }
    });

    // ===== 输入框自动高搴?=====
    const textarea = document.getElementById('inputBox');
    textarea.addEventListener('input', () => {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
    });

    // ===== 滚动到底部 =====
    msgArea.scrollTop = msgArea.scrollHeight;

    // ===== 表情面板 =====
    const emojiBtn = document.getElementById('emojiBtn');
    const emojiPanel = document.getElementById('emojiPanel');
    const customEmojis = document.getElementById('customEmojis');
    const unicodeEmojis = document.getElementById('unicodeEmojis');

    // Tab 切换 + 滑动
    const emojiTabs = document.querySelectorAll('.emoji-tab');
    const emojiPackIcons = document.querySelectorAll('.emoji-pack-icon');
    const emojiSlider = document.getElementById('emojiSlider');
    let currentTab = 0;

    function switchEmojiTab(index) {
      currentTab = index;
      emojiSlider.style.transform = `translateX(-${index * 50}%)`;
      const tabName = index === 0 ? 'sticker' : 'emoji';
      emojiTabs.forEach(t => t.classList.toggle('active', t.dataset.emojiTab === tabName));
      emojiPackIcons.forEach(p => {
        const match = (index === 0 && p.dataset.pack === 'xiaobai') ||
                      (index === 1 && p.dataset.pack === 'common');
        p.classList.toggle('active', match);
      });
    }

    emojiTabs.forEach(tab => {
      tab.addEventListener('click', () => switchEmojiTab(tab.dataset.emojiTab === 'sticker' ? 0 : 1));
    });
    emojiPackIcons.forEach(icon => {
      icon.addEventListener('click', () => switchEmojiTab(icon.dataset.pack === 'xiaobai' ? 0 : 1));
    });

    // 触摸滑动
    let touchStartX = 0, touchDeltaX = 0, isSwiping = false;
    const panelBody = document.querySelector('.emoji-panel-body');

    panelBody.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchDeltaX = 0;
      isSwiping = false;
      emojiSlider.style.transition = 'none';
    });
    panelBody.addEventListener('touchmove', (e) => {
      touchDeltaX = e.touches[0].clientX - touchStartX;
      if (Math.abs(touchDeltaX) > 10) isSwiping = true;
      if (isSwiping) {
        const base = -currentTab * 50;
        const offset = (touchDeltaX / panelBody.offsetWidth) * 50;
        const clamped = Math.max(-50, Math.min(0, base + offset));
        emojiSlider.style.transform = `translateX(${clamped}%)`;
      }
    });
    panelBody.addEventListener('touchend', () => {
      emojiSlider.style.transition = '';
      if (isSwiping) {
        if (touchDeltaX < -40 && currentTab === 0) switchEmojiTab(1);
        else if (touchDeltaX > 40 && currentTab === 1) switchEmojiTab(0);
        else switchEmojiTab(currentTab);
      }
    });

    const xiaobaiEmotions = [
      { file: '01_Ĭ认温柔.png', name: '温柔' },
      { file: '02_开心明亮.png', name: '开心' },
      { file: '03_害羞΢Ц.png', name: '害羞' },
      { file: '04_认真倾听.png', name: '认真' },
      { file: '05_关心担忧.png', name: '担忧' },
      { file: '06_ί屈С嘴.png', name: 'ί屈' },
      { file: '07_轻΢惊讶.png', name: '惊讶' },
      { file: '08_无奈温柔.png', name: '无奈' },
      { file: '09_困倦慵懒.png', name: '困了' },
      { file: '10_生气但不凶.png', name: '生气' },
      { file: '11_撒娇期待.png', name: '撒娇' },
      { file: '12_晚安΢Ц.png', name: '晚安' }
    ];

    xiaobaiEmotions.forEach(em => {
      const div = document.createElement('div');
      div.className = 'emoji-item';
      div.title = em.name;
      div.innerHTML = `<img src="images/xiaobai-emotions/${em.file}" alt="${em.name}"><span class="emoji-item-label">${em.name}</span>`;
      div.addEventListener('click', () => {
        emojiPanel.classList.remove('show');
        emojiBtn.classList.remove('active');
      });
      customEmojis.appendChild(div);
    });

    const commonEmojis = ['😊','😀','😁','😌','😉','🥹','😳','😘','👍','👏','❤️','🌭','✅','🎀','😻','🥰','🙄','🙏','🫶','🙂','🤗','😫','😴','☀️','🥳','💆','🎰','🍃','☁️','🌫','💐','💏','🫰','🎜','🌛'];
    commonEmojis.forEach(em => {
      const span = document.createElement('span');
      span.className = 'emoji-unicode';
      span.textContent = em;
      span.addEventListener('click', () => {
        textarea.value += em;
        textarea.dispatchEvent(new Event('input'));
        emojiPanel.classList.remove('show');
        emojiBtn.classList.remove('active');
      });
      unicodeEmojis.appendChild(span);
    });

    emojiBtn.addEventListener('click', () => {
      const showing = emojiPanel.classList.toggle('show');
      emojiBtn.classList.toggle('active', showing);
    });

    // 点击消息区域收起表情面板
    msgArea.addEventListener('click', () => {
      if (emojiPanel.classList.contains('show')) {
        emojiPanel.classList.remove('show');
        emojiBtn.classList.remove('active');
      }
    });

    // ===== 发送按ť =====
    const sendBtn = document.getElementById('sendBtn');
    sendBtn.addEventListener('click', () => {
      sendBtn.style.transform = 'scale(.7)';
      setTimeout(() => { sendBtn.style.transform = ''; }, 150);
      sendMessage();
    });
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // ===== ͼƬ按ť =====
    const chatImageInput = document.getElementById('chatImageInput');
    document.getElementById('imageBtn').addEventListener('click', () => {
      chatImageInput?.click();
    });
    chatImageInput?.addEventListener('change', async event => {
      const input = event.target;
      const file = input?.files?.[0];
      if (!file) return;

      if (!['image/png', 'image/jpeg', 'image/webp'].includes(file.type)) {
        alert('先֧持 PNG、JPG、WEBP ͼƬ');
        input.value = '';
        return;
      }

      try {
        await sendImageMessage(file);
      } catch (error) {
        appendMessage({ role: 'assistant', content: `（发ͼʧ败：${error.message}）`, created_at: Date.now() });
      } finally {
        input.value = '';
      }
    });

    (function pseudo2dAnim() {
      const container = document.getElementById('pseudo2dBlink');
      if (!container) return;
      const frames = container.querySelectorAll('img');
      let current = 0;

      function showFrame(idx) {
        frames.forEach((f, i) => f.classList.toggle('frame-active', i === idx));
        frames[0].style.opacity = idx === 0 ? '1' : '0';
      }

      function blink() {
        showFrame(1); // 半闭
        setTimeout(() => {
          showFrame(2); // 闂溂
          setTimeout(() => {
            showFrame(1); // 半闭
            setTimeout(() => {
              showFrame(0); // 睁眼
            }, 80);
          }, 100);
        }, 80);
      }

      function hairMove() {
        showFrame(3); // 头发椋?        setTimeout(() => showFrame(0), 600);
      }

      function tilt() {
        showFrame(4); // 姝ご
        setTimeout(() => showFrame(0), 800);
      }

      // 主循环：每 3-5 秒眨一次眼，偶尔穿插点头/摇头
      let count = 0;
      function loop() {
        count++;
        if (count % 5 === 0 && frames[4]) {
          tilt();
        } else if (count % 3 === 0 && frames[3]) {
          hairMove();
        } else {
          blink();
        }
        const next = 2500 + Math.random() * 2000;
        setTimeout(loop, next);
      }
      setTimeout(loop, 2000);
    })();
  </script>
