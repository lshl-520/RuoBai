<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台登录 · 若白 RuoBai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-50:  #FBEAF0;
      --pink-100: #F4C0D1;
      --pink-200: #ED93B1;
      --pink-400: #D4537E;
      --pink-500: #B73D67;
      --pink-700: #72243E;
      --pink-900: #4B1528;
      --cream:    #fffaf6;
      --bg-page:  #fdf7f6;
      --muted:    #993556;
      --line:     rgba(244, 192, 209, .55);
      --shadow:   0 12px 32px rgba(212, 83, 126, .06);
      --serif: 'Noto Serif SC', "PingFang SC", "Microsoft YaHei", serif;
      --sans:  'Sora', "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--pink-900);
      background:
        linear-gradient(135deg, rgba(253, 247, 246, 0.55), rgba(244, 192, 209, 0.35)),
        url('./images/auth-bg.webp') center/cover no-repeat fixed,
        var(--bg-page);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.7;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top right, rgba(212, 83, 126, .10), transparent 38%),
        radial-gradient(circle at bottom left, rgba(237, 147, 177, .08), transparent 42%);
      pointer-events: none;
      z-index: 0;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(212, 83, 126, .18);
      padding: 44px 36px 36px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .brand {
      display: inline-block;
      margin-bottom: 22px;
    }
    .brand img {
      width: 64px; height: 64px;
      border-radius: 20px;
      object-fit: cover;
      border: 1px solid var(--pink-100);
    }
    .admin-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      letter-spacing: .05em;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(212, 83, 126, .25);
    }
    .auth-title {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 500;
      margin: 0 0 8px;
      letter-spacing: -.01em;
      color: var(--pink-900);
    }
    .auth-sub {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 28px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 14px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: .02em;
      font-weight: 500;
    }
    .form-input {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid var(--pink-100);
      border-radius: 14px;
      font-size: 15px;
      background: var(--cream);
      color: var(--pink-900);
      transition: .2s;
      font-family: inherit;
    }
    .form-input::placeholder { color: var(--pink-200); }
    .form-input:focus {
      outline: none;
      border-color: var(--pink-400);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(212, 83, 126, .10);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: var(--pink-400);
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: .2s;
      box-shadow: 0 14px 28px rgba(212, 83, 126, .22);
      font-family: inherit;
      margin-top: 8px;
      letter-spacing: .02em;
    }
    .btn-submit:hover:not(:disabled) {
      background: var(--pink-500);
      transform: translateY(-1px);
      box-shadow: 0 18px 34px rgba(212, 83, 126, .28);
    }
    .btn-submit:disabled {
      opacity: .65;
      cursor: not-allowed;
    }
    .auth-msg {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      display: none;
      text-align: left;
      line-height: 1.6;
    }
    .auth-msg.show { display: block; }
    .auth-msg.error {
      background: #fff0f3;
      color: #c44569;
      border: 1px solid #ffd6dd;
    }
    .auth-msg.success {
      background: #fbf0f5;
      color: var(--pink-700);
      border: 1px solid var(--pink-100);
    }
    .auth-hint {
      margin-top: 22px;
      padding: 12px 16px;
      background: var(--pink-50);
      border-radius: 14px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.85;
      text-align: left;
    }
    .auth-hint code {
      background: #fff;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--pink-100);
      font-family: 'SF Mono', Consolas, "Microsoft YaHei", monospace;
      color: var(--pink-400);
      font-size: 12px;
      font-weight: 500;
    }
    .auth-foot {
      margin-top: 22px;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }
    .auth-foot a {
      color: var(--pink-400);
      text-decoration: none;
      transition: .2s;
    }
    .auth-foot a:hover { color: var(--pink-500); }
    .divider { color: var(--pink-100); }
    .dots {
      display: inline-flex;
      gap: 4px;
      vertical-align: middle;
    }
    .dots span {
      width: 5px; height: 5px;
      background: #fff;
      border-radius: 50%;
      animation: dot 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dot {
      0%, 60%, 100% { opacity: .35; }
      30% { opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
    .auth-form {
      animation: fadeIn .35s ease;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <img src="./images/xiaobai-emotions/01_默认温柔.png" alt="若白头像" onerror="this.style.display='none'">
    </div>

    <div class="admin-badge">ADMIN</div>
    <h1 class="auth-title">管理后台</h1>
    <p class="auth-sub">仅限管理员访问</p>

    <div id="msg" class="auth-msg"></div>

    <!-- 登录表单 -->
    <form id="loginForm" class="auth-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="loginUsername">管理员账号</label>
        <input
          type="text"
          id="loginUsername"
          name="username"
          class="form-input"
          placeholder="请输入管理员账号"
          autocomplete="username"
          required>
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword">密码</label>
        <input
          type="password"
          id="loginPassword"
          name="password"
          class="form-input"
          placeholder="请输入密码"
          autocomplete="current-password"
          required>
      </div>
      <button type="submit" class="btn-submit" id="loginBtn">
        <span id="loginText">登录后台</span>
      </button>
    </form>
    <div class="auth-foot">
      <span style="color:var(--pink-200)">仅限管理员访问</span>
    </div>
  </div>

  <script>
    // ========== 元素引用 ==========
    const msg = document.getElementById('msg');
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const loginText = document.getElementById('loginText');
    const loginUsername = document.getElementById('loginUsername');
    const loginPassword = document.getElementById('loginPassword');

    // ========== 工具方法 ==========
    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = 'auth-msg show ' + type;
    }
    function hideMessage() {
      msg.className = 'auth-msg';
    }
    function setLoading(btn, textEl, loading, defaultText) {
      btn.disabled = loading;
      textEl.innerHTML = loading
        ? '<span class="dots"><span></span><span></span><span></span></span>'
        : defaultText;
    }

    // ========== 自动跳转：已登录且是管理员 ==========
    fetch('/api/auth/session', { credentials: 'same-origin' })
      .then(r => r.json())
      .then(data => {
        if (data && data.loggedIn && data.user?.role === 'owner') {
          window.location.replace('admin.html');
        }
      })
      .catch(() => {});

    // ========== 登录提交 ==========
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessage();

      const username = loginUsername.value.trim();
      const password = loginPassword.value.trim();

      if (!username) {
        showMessage('请输入管理员账号', 'error');
        loginUsername.focus();
        return;
      }
      if (!password) {
        showMessage('请输入密码', 'error');
        loginPassword.focus();
        return;
      }

      setLoading(loginBtn, loginText, true, '登录后台');

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'same-origin'
        });
        const data = await response.json().catch(() => null);

        if (data && data.success) {
          // 验证用户角色
          const sessionResponse = await fetch('/api/auth/session', { credentials: 'same-origin' });
          const sessionData = await sessionResponse.json().catch(() => null);

          if (sessionData && sessionData.user?.role === 'owner') {
            showMessage('登录成功，正在进入后台...', 'success');
            setTimeout(() => {
              window.location.replace('admin.html');
            }, 400);
          } else {
            // 不是管理员，退出登录
            await fetch('/api/auth/logout', {
              method: 'POST',
              credentials: 'same-origin'
            });
            showMessage('此账号无管理员权限', 'error');
            setLoading(loginBtn, loginText, false, '登录后台');
            loginPassword.value = '';
            loginPassword.focus();
          }
        } else {
          showMessage((data && data.error) || '账号或密码错误', 'error');
          setLoading(loginBtn, loginText, false, '登录后台');
          loginPassword.select();
        }
      } catch (err) {
        showMessage('网络错误，请重试', 'error');
        setLoading(loginBtn, loginText, false, '登录后台');
      }
    });
  </script>
</body>
</html>
