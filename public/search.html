<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>搜索聊天记录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-50:  #FBEAF0;
      --pink-100: #F4C0D1;
      --pink-200: #ED93B1;
      --pink-400: #D4537E;
      --pink-500: #B73D67;
      --pink-700: #72243E;
      --pink-900: #4B1528;
      --bg-page:  #fdf7f6;
      --muted:    #993556;
      --subtle:   #b8607e;
      --line:     rgba(244, 192, 209, .55);
      --cream:    #fffaf6;
      --glass:    rgba(255, 255, 255, .82);
      --serif: 'Noto Serif SC', "PingFang SC", "Microsoft YaHei", serif;
      --sans: 'Sora', "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--sans);
      color: var(--pink-900);
      background:
        radial-gradient(circle at 0% 0%, rgba(237, 147, 177, .08), transparent 34%),
        radial-gradient(circle at 100% 0%, rgba(212, 83, 126, .05), transparent 30%),
        var(--bg-page);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 56px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .88);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .back-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--pink-50);
      color: var(--pink-400);
      flex: 0 0 auto;
    }
    .back-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .topbar-title {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 600;
      line-height: 1;
    }

    .shell {
      width: min(100%, 1160px);
      margin: 0 auto;
      padding: 12px 12px 18px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-card,
    .panel {
      background: rgba(255, 255, 255, .9);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(212, 83, 126, .06);
    }

    .search-card {
      padding: 14px;
    }
    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .search-field {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 2px solid var(--pink-200);
      border-radius: 16px;
      background: #fff;
      padding: 10px 14px;
    }
    .search-field:focus-within {
      border-color: var(--pink-400);
      box-shadow: 0 4px 14px rgba(212, 83, 126, .14);
    }
    .search-field svg {
      width: 18px;
      height: 18px;
      stroke: var(--pink-400);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      flex: 0 0 auto;
    }
    .search-field input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--pink-900);
      font-size: 15px;
    }
    .search-field input::placeholder { color: var(--pink-200); }
    .search-btn {
      height: 38px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
      cursor: pointer;
      font-weight: 500;
      flex: 0 0 auto;
    }

    .filters {
      margin-top: 12px;
      display: grid;
      gap: 12px;
    }
    .filter-row {
      display: grid;
      gap: 8px;
      align-items: start;
    }
    .filter-head {
      font-size: 12px;
      color: var(--subtle);
      font-weight: 500;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .chip {
      border: 1px solid var(--pink-100);
      background: var(--cream);
      color: var(--pink-900);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      transition: all .2s;
    }
    .chip:hover { background: var(--pink-50); }
    .chip.active {
      background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
      color: #fff;
      border-color: var(--pink-500);
      box-shadow: 0 2px 8px rgba(212, 83, 126, .22);
    }
    .more-toggle {
      border: 0;
      background: transparent;
      color: var(--pink-400);
      padding: 0;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .more-toggle svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      transition: transform .2s;
    }
    .more-toggle.open svg { transform: rotate(180deg); }

    .more-filters {
      max-height: 0;
      overflow: hidden;
      transition: max-height .25s ease;
      border-top: 1px solid transparent;
    }
    .more-filters.open {
      max-height: 180px;
      border-top-color: var(--line);
      padding-top: 12px;
      margin-top: 4px;
    }
    .range-row {
      display: grid;
      grid-template-columns: auto 1fr auto 1fr;
      gap: 8px;
      align-items: center;
      color: var(--subtle);
      font-size: 12px;
    }
    .range-input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--pink-100);
      border-radius: 10px;
      padding: 8px 10px;
      background: var(--cream);
      outline: none;
      color: var(--pink-900);
    }
    .range-input::placeholder { color: var(--pink-200); }

    .content {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 0;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .92);
    }
    .results-panel {
      flex: 0 0 46%;
      min-width: 340px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      min-height: 0;
    }
    .results-header {
      flex: 0 0 auto;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--subtle);
      border-bottom: 1px solid var(--line);
    }
    .results-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
    }
    .results-list::-webkit-scrollbar,
    .context-panel::-webkit-scrollbar { width: 5px; }
    .results-list::-webkit-scrollbar-thumb,
    .context-panel::-webkit-scrollbar-thumb { background: var(--pink-100); border-radius: 3px; }

    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--subtle);
      text-align: center;
      padding: 24px;
    }
    .empty-state svg {
      width: 56px;
      height: 56px;
      stroke: var(--pink-200);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .6;
    }
    .empty-state p { margin: 0; font-size: 14px; }

    .result-item {
      display: flex;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      background: #fff;
      transition: all .2s;
      animation: slideIn .25s ease;
    }
    .result-item:hover,
    .result-item.active {
      transform: translateY(-1px);
      background: var(--pink-50);
      border-color: var(--pink-400);
      box-shadow: 0 4px 12px rgba(212, 83, 126, .08);
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--pink-50);
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .result-body { flex: 1; min-width: 0; }
    .result-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }
    .result-name { font-size: 13px; font-weight: 500; }
    .result-time { font-size: 11px; color: var(--subtle); }
    .result-content {
      font-size: 14px;
      line-height: 1.5;
      color: var(--pink-900);
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .highlight {
      background: linear-gradient(135deg, var(--pink-100), var(--pink-50));
      color: var(--pink-700);
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 600;
    }
    .pagination {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--line);
    }
    .page-btn,
    .page-num {
      border: 1px solid var(--pink-100);
      border-radius: 8px;
      background: var(--cream);
      color: var(--pink-900);
      cursor: pointer;
      font-size: 13px;
      padding: 6px 12px;
      user-select: none;
    }
    .page-btn.disabled { opacity: .4; pointer-events: none; }
    .page-num {
      width: 32px;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .page-num.active {
      color: #fff;
      border-color: var(--pink-500);
      background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
      font-weight: 600;
    }

    .context-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      background: var(--bg-page);
    }
    .context-empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: var(--subtle);
      text-align: center;
    }
    .context-empty svg {
      width: 56px;
      height: 56px;
      stroke: var(--pink-200);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .6;
    }
    .context-empty p { margin: 0; font-size: 14px; }
    .context-messages { display: none; }
    .context-messages.show {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg-row {
      display: flex;
      gap: 10px;
      max-width: 85%;
      animation: slideIn .25s ease;
    }
    .msg-row.me { margin-left: auto; flex-direction: row-reverse; }
    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      overflow: hidden;
      flex: 0 0 auto;
      background: var(--pink-50);
    }
    .msg-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .msg-bubble {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--pink-900);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.me .msg-bubble {
      background: linear-gradient(135deg, var(--pink-100), var(--pink-50));
    }
    .msg-time {
      margin-top: 4px;
      font-size: 11px;
      color: var(--subtle);
    }
    .target-message .msg-bubble {
      box-shadow: 0 0 0 2px rgba(212, 83, 126, .18);
    }
    .context-head {
      flex: 0 0 auto;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      color: var(--subtle);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(75, 21, 40, .22);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      z-index: 40;
    }
    .modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }
    .date-modal {
      width: min(100%, 350px);
      background: rgba(255, 255, 255, .97);
      border-radius: 22px;
      padding: 22px 20px 18px;
      box-shadow: 0 18px 48px rgba(75, 21, 40, .18);
      border: 1px solid rgba(244, 192, 209, .7);
    }
    .date-modal-title {
      text-align: center;
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 18px;
    }
    .date-field-row {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }
    .date-label {
      font-size: 12px;
      color: var(--subtle);
      font-weight: 500;
    }
    .date-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 2px solid var(--pink-100);
      border-radius: 14px;
      padding: 10px 12px;
      background: var(--cream);
    }
    .date-input-wrap:focus-within {
      border-color: var(--pink-400);
      background: #fff;
    }
    .date-input-wrap input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--pink-900);
    }
    .date-input-wrap svg {
      width: 18px;
      height: 18px;
      stroke: var(--pink-500);
      fill: none;
      stroke-width: 2;
      flex: 0 0 auto;
    }
    .date-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }
    .date-btn {
      height: 40px;
      border-radius: 14px;
      border: 0;
      cursor: pointer;
      font-size: 15px;
    }
    .date-btn.cancel {
      background: var(--pink-50);
      color: var(--pink-700);
    }
    .date-btn.confirm {
      background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
      color: #fff;
      box-shadow: 0 4px 14px rgba(212, 83, 126, .22);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
      .shell { padding: 10px; }
      .content {
        flex-direction: column;
        overflow: visible;
        border: 0;
        background: transparent;
        gap: 12px;
      }
      .results-panel,
      .context-panel {
        flex: none;
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 18px;
      }
      .context-panel { display: none; min-height: 280px; }
      .page.has-context .context-panel { display: flex; }
      .results-panel { min-height: 420px; }
      .search-row { flex-direction: row; }
      .search-btn { padding: 0 14px; }
      .range-row {
        grid-template-columns: 1fr auto 1fr;
      }
      .range-row .label-start,
      .range-row .label-end {
        display: none;
      }
      .range-row .full-span {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="searchPage">
    <div class="topbar">
      <a class="back-btn" id="backBtn" href="#">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <div class="topbar-title">搜索聊天记录</div>
    </div>

    <div class="shell">
      <div class="search-card">
        <div class="search-row">
          <div class="search-field">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input id="searchInput" type="text" placeholder="搜索关键词">
          </div>
          <button class="search-btn" id="searchBtn" type="button">搜索</button>
        </div>

        <div class="filters">
          <div class="filter-row">
            <div class="filter-head">时间范围：</div>
            <div class="chips" id="timeChips">
              <div class="chip active" data-time="all">全部</div>
              <div class="chip" data-time="today">今天</div>
              <div class="chip" data-time="week">近7天</div>
              <div class="chip" data-time="month">近30天</div>
              <div class="chip" data-time="custom">自定义</div>
            </div>
          </div>

          <div class="filter-row">
            <div class="filter-head">消息类型：</div>
            <div class="chips" style="justify-content:space-between;align-items:center">
              <div class="chips" id="typeChips">
                <div class="chip active" data-type="all">全部</div>
                <div class="chip" data-type="me">我发送的</div>
                <div class="chip" data-type="them">对方发送的</div>
              </div>
              <button class="more-toggle" id="moreToggle" type="button">
                更多筛选
                <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
            </div>
          </div>

          <div class="more-filters" id="moreFilters">
            <div class="filter-row">
              <div class="filter-head">消息长度：</div>
              <div class="range-row">
                <span class="label-start">最小</span>
                <input class="range-input" id="minLength" type="number" min="0" placeholder="最小">
                <span class="label-end">-</span>
                <input class="range-input" id="maxLength" type="number" min="0" placeholder="最大">
              </div>
            </div>
            <div class="filter-row">
              <div class="filter-head">关键词出现次数：</div>
              <div class="range-row">
                <span class="label-start">最少</span>
                <input class="range-input" id="minKeywordCount" type="number" min="0" value="1">
                <span class="label-end">-</span>
                <input class="range-input" id="maxKeywordCount" type="number" min="0" placeholder="最多">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="content">
        <section class="results-panel panel">
          <div class="results-header" id="resultsHeader">输入关键词开始搜索</div>
          <div class="results-list" id="resultsList">
            <div class="empty-state">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <p>输入关键词搜索聊天记录</p>
            </div>
          </div>
          <div class="pagination" id="pagination" style="display:none;">
            <div class="page-btn" id="prevPageBtn">上一页</div>
            <div id="pageNums" style="display:flex;gap:6px;"></div>
            <div class="page-btn" id="nextPageBtn">下一页</div>
          </div>
        </section>

        <section class="context-panel panel" id="contextPanel">
          <div class="context-empty" id="contextEmpty">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <p>点击搜索结果查看完整对话</p>
          </div>
          <div class="context-messages" id="contextMessages"></div>
        </section>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="dateModal">
    <div class="date-modal">
      <div class="date-modal-title">选择时间范围</div>
      <div class="date-field-row">
        <div class="date-label">开始日期</div>
        <label class="date-input-wrap">
          <input id="dateStartInput" type="date">
        </label>
      </div>
      <div class="date-field-row">
        <div class="date-label">结束日期</div>
        <label class="date-input-wrap">
          <input id="dateEndInput" type="date">
        </label>
      </div>
      <div class="date-actions">
        <button class="date-btn cancel" id="dateCancelBtn" type="button">取消</button>
        <button class="date-btn confirm" id="dateConfirmBtn" type="button">确定</button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const roleId = parseInt(params.get('id') || '0', 10);
    const roleName = params.get('name') || '若白';
    const DEFAULT_AVATAR = 'images/ruobai-avatar-round.png';
    const USER_AVATAR = 'images/xiaobai-emotions/01_默认温柔.png';

    const page = document.getElementById('searchPage');
    const backBtn = document.getElementById('backBtn');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultsHeader = document.getElementById('resultsHeader');
    const resultsList = document.getElementById('resultsList');
    const contextEmpty = document.getElementById('contextEmpty');
    const contextMessages = document.getElementById('contextMessages');
    const contextPanel = document.getElementById('contextPanel');
    const pagination = document.getElementById('pagination');
    const pageNums = document.getElementById('pageNums');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const moreToggle = document.getElementById('moreToggle');
    const moreFilters = document.getElementById('moreFilters');
    const dateModal = document.getElementById('dateModal');
    const dateStartInput = document.getElementById('dateStartInput');
    const dateEndInput = document.getElementById('dateEndInput');
    const dateCancelBtn = document.getElementById('dateCancelBtn');
    const dateConfirmBtn = document.getElementById('dateConfirmBtn');
    const minLength = document.getElementById('minLength');
    const maxLength = document.getElementById('maxLength');
    const minKeywordCount = document.getElementById('minKeywordCount');
    const maxKeywordCount = document.getElementById('maxKeywordCount');
    const timeChips = document.getElementById('timeChips');
    const typeChips = document.getElementById('typeChips');

    const state = {
      role: {
        id: roleId || null,
        name: roleName,
        avatar: DEFAULT_AVATAR
      },
      items: [],
      matches: [],
      page: 1,
      pageSize: 10,
      filters: {
        time: 'all',
        type: 'all',
        customStart: '',
        customEnd: '',
        minLength: '',
        maxLength: '',
        minKeywordCount: '1',
        maxKeywordCount: ''
      },
      query: ''
    };
    searchInput.value = params.get('q') || '';

    function escapeHtml(text) {
      return String(text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function escapeRegExp(text) {
      return String(text || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlightText(text, keyword) {
      const safe = escapeHtml(text);
      if (!keyword) return safe;
      return safe.replace(new RegExp(escapeRegExp(keyword), 'gi'), match => `<span class="highlight">${match}</span>`);
    }

    function parseTime(value) {
      const ts = Date.parse(value);
      return Number.isFinite(ts) ? ts : 0;
    }

    function sameDay(ts, now) {
      const a = new Date(ts);
      const b = new Date(now);
      return a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
    }

    function formatDateValue(value) {
      const d = value ? new Date(value) : new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function countKeywordOccurrences(text, keyword) {
      if (!keyword) return 0;
      const matches = String(text || '').match(new RegExp(escapeRegExp(keyword), 'gi'));
      return matches ? matches.length : 0;
    }

    function avatarHtml(item) {
      if (item.role === 'user') return `<div class="avatar">${USER_AVATAR_ICON}</div>`;
      const avatar = state.role.avatar || DEFAULT_AVATAR;
      return `<div class="avatar"><img src="${escapeHtml(avatar)}" alt=""></div>`;
    }

    const USER_AVATAR_ICON = '👤';

    async function loadRole() {
      if (!state.role.id) return;
      try {
        const res = await fetch('/api/roles', { credentials: 'include' });
        const data = await res.json();
        const found = data?.items?.find(r => r.id === state.role.id);
        if (found) {
          state.role.name = found.name || state.role.name;
          state.role.avatar = found.avatar || DEFAULT_AVATAR;
        }
      } catch (_) {}
      backBtn.href = `chat-room.html?id=${encodeURIComponent(state.role.id || '')}&name=${encodeURIComponent(state.role.name || '')}`;
    }

    async function loadMessages() {
      if (!state.role.id) return [];
      const res = await fetch(`/api/chat?character_id=${state.role.id}&limit=500`, { credentials: 'include' });
      const data = await res.json();
      return data?.success && Array.isArray(data.items) ? data.items : [];
    }

    function applyFilters() {
      const q = state.query.trim().toLowerCase();
      const now = Date.now();
      state.matches = state.items.filter(item => {
        const text = String(item.content || '');
        const createdAt = parseTime(item.created_at);
        if (state.filters.time === 'today' && !sameDay(createdAt, now)) return false;
        if (state.filters.time === 'week' && createdAt < now - 7 * 24 * 60 * 60 * 1000) return false;
        if (state.filters.time === 'month' && createdAt < now - 30 * 24 * 60 * 60 * 1000) return false;
        if (state.filters.time === 'custom') {
          const start = state.filters.customStart ? new Date(`${state.filters.customStart}T00:00:00`).getTime() : null;
          const end = state.filters.customEnd ? new Date(`${state.filters.customEnd}T23:59:59`).getTime() : null;
          if (start !== null && createdAt < start) return false;
          if (end !== null && createdAt > end) return false;
        }
        if (state.filters.type === 'me' && item.role !== 'user') return false;
        if (state.filters.type === 'them' && item.role === 'user') return false;

        const len = text.length;
        const minLen = state.filters.minLength === '' ? null : Number(state.filters.minLength);
        const maxLen = state.filters.maxLength === '' ? null : Number(state.filters.maxLength);
        if (minLen !== null && len < minLen) return false;
        if (maxLen !== null && len > maxLen) return false;

        if (q) {
          if (!text.toLowerCase().includes(q)) return false;
          const count = countKeywordOccurrences(text, q);
          const minCount = state.filters.minKeywordCount === '' ? null : Number(state.filters.minKeywordCount);
          const maxCount = state.filters.maxKeywordCount === '' ? null : Number(state.filters.maxKeywordCount);
          if (minCount !== null && count < minCount) return false;
          if (maxCount !== null && count > maxCount) return false;
        }

        return true;
      });
      state.page = 1;
      renderResults();
    }

    function renderResults() {
      const total = state.matches.length;
      resultsHeader.textContent = total ? `共找到 ${total} 条相关记录` : (state.query.trim() ? '没有找到相关消息' : '输入关键词开始搜索');

      const start = (state.page - 1) * state.pageSize;
      const pageItems = state.matches.slice(start, start + state.pageSize);

      if (!state.query.trim()) {
        resultsList.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <p>输入关键词搜索聊天记录</p>
          </div>`;
        pagination.style.display = 'none';
        return;
      }
      if (!pageItems.length) {
        resultsList.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <p>没有找到相关消息</p>
          </div>`;
        pagination.style.display = 'none';
        return;
      }

      resultsList.innerHTML = pageItems.map((item, index) => {
        const avatar = item.role === 'user'
          ? `<div class="avatar">${USER_AVATAR_ICON}</div>`
          : `<div class="avatar"><img src="${escapeHtml(state.role.avatar || DEFAULT_AVATAR)}" alt=""></div>`;
        const sender = item.role === 'user' ? '我' : state.role.name;
        return `
          <div class="result-item" data-index="${start + index}">
            ${avatar}
            <div class="result-body">
              <div class="result-top">
                <div class="result-name">${escapeHtml(sender)}</div>
                <div class="result-time">${formatTime(item.created_at)}</div>
              </div>
              <div class="result-content">${highlightText(item.content || '', state.query.trim())}</div>
            </div>
          </div>`;
      }).join('');

      resultsList.querySelectorAll('.result-item').forEach(item => {
        item.addEventListener('click', () => {
          const index = Number(item.dataset.index);
          renderContext(index);
          resultsList.querySelectorAll('.result-item').forEach(el => el.classList.remove('active'));
          item.classList.add('active');
        });
      });

      renderPagination(total);
    }

    function renderPagination(total) {
      const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
      if (totalPages <= 1) {
        pagination.style.display = 'none';
        return;
      }
      pagination.style.display = 'flex';
      prevPageBtn.classList.toggle('disabled', state.page <= 1);
      nextPageBtn.classList.toggle('disabled', state.page >= totalPages);
      pageNums.innerHTML = '';
      for (let i = 1; i <= Math.min(totalPages, 5); i++) {
        const el = document.createElement('div');
        el.className = `page-num${i === state.page ? ' active' : ''}`;
        el.textContent = String(i);
        el.addEventListener('click', () => {
          state.page = i;
          renderResults();
        });
        pageNums.appendChild(el);
      }
    }

    function formatTime(value) {
      const d = value ? new Date(value) : new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function renderContext(index) {
      const item = state.matches[index];
      if (!item) return;
      const baseIndex = state.items.findIndex(m => m === item || (m.id && item.id && String(m.id) === String(item.id)));
      const start = Math.max(0, baseIndex - 3);
      const end = Math.min(state.items.length, baseIndex + 4);
      const context = state.items.slice(start, end);
      contextEmpty.style.display = 'none';
      contextMessages.classList.add('show');
      page.classList.add('has-context');
      contextMessages.innerHTML = `
        <div class="context-head">点击结果查看完整对话</div>
        ${context.map((m, i) => {
          const target = m === item || (m.id && item.id && String(m.id) === String(item.id));
          const rowClass = m.role === 'user' ? 'me' : 'them';
          return `
            <div class="msg-row ${rowClass}${target ? ' target-message' : ''}" style="animation: slideIn .25s ease ${i * 0.03}s both;">
              <div class="msg-avatar">${m.role === 'user'
                ? '<div class="avatar">👤</div>'
                : `<img src="${escapeHtml(state.role.avatar || DEFAULT_AVATAR)}" alt="">`}</div>
              <div>
                <div class="msg-bubble">${highlightText(m.content || '', state.query.trim())}</div>
                <div class="msg-time">${formatTime(m.created_at)}</div>
              </div>
            </div>`;
        }).join('')}
      `;
      setTimeout(() => {
        contextPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 50);
    }

    function attachChipGroup(root, key) {
      root.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          if (key === 'time' && chip.dataset.time === 'custom') {
            openDateModal();
            return;
          }
          root.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
          chip.classList.add('active');
          state.filters[key] = chip.dataset[key] || chip.dataset.time || chip.dataset.type || 'all';
          applyFilters();
        });
      });
    }
    attachChipGroup(timeChips, 'time');
    attachChipGroup(typeChips, 'type');

    function openDateModal() {
      dateStartInput.value = state.filters.customStart || formatDateValue(Date.now() - 7 * 24 * 60 * 60 * 1000);
      dateEndInput.value = state.filters.customEnd || formatDateValue(Date.now());
      dateModal.classList.add('show');
    }

    function closeDateModal() {
      dateModal.classList.remove('show');
    }

    function syncFilters() {
      state.filters.minLength = minLength.value.trim();
      state.filters.maxLength = maxLength.value.trim();
      state.filters.minKeywordCount = minKeywordCount.value.trim();
      state.filters.maxKeywordCount = maxKeywordCount.value.trim();
    }

    async function runSearch() {
      state.query = searchInput.value || '';
      syncFilters();
      applyFilters();
    }

    function resetResults() {
      state.matches = [];
      state.page = 1;
      page.classList.remove('has-context');
      contextMessages.classList.remove('show');
      contextMessages.innerHTML = '';
      contextEmpty.style.display = 'flex';
      renderResults();
    }

    searchBtn.addEventListener('click', runSearch);
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') runSearch();
    });
    moreToggle.addEventListener('click', () => {
      const open = moreFilters.classList.toggle('open');
      moreToggle.classList.toggle('open', open);
    });
    dateCancelBtn.addEventListener('click', closeDateModal);
    dateConfirmBtn.addEventListener('click', () => {
      if (!dateStartInput.value || !dateEndInput.value) return;
      if (dateStartInput.value > dateEndInput.value) {
        const temp = dateStartInput.value;
        dateStartInput.value = dateEndInput.value;
        dateEndInput.value = temp;
      }
      state.filters.customStart = dateStartInput.value;
      state.filters.customEnd = dateEndInput.value;
      state.filters.time = 'custom';
      timeChips.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
      timeChips.querySelector('[data-time="custom"]')?.classList.add('active');
      closeDateModal();
      applyFilters();
    });
    dateModal.addEventListener('click', (e) => {
      if (e.target === dateModal) closeDateModal();
    });
    [minLength, maxLength, minKeywordCount, maxKeywordCount].forEach(input => {
      input.addEventListener('input', () => {
        if (state.query.trim()) runSearch();
      });
    });
    prevPageBtn.addEventListener('click', () => {
      if (state.page > 1) {
        state.page--;
        renderResults();
      }
    });
    nextPageBtn.addEventListener('click', () => {
      const totalPages = Math.ceil(state.matches.length / state.pageSize);
      if (state.page < totalPages) {
        state.page++;
        renderResults();
      }
    });

    loadRole().then(async () => {
      state.items = await loadMessages();
      renderResults();
      if (searchInput.value.trim()) runSearch();
    });
  </script>
</body>
</html>
